name: JENIOS B164 demo association and reconciliation
on:
  push:
    branches: [fix/jenios-b161-b164-demo-association-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-demo-association:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact additive scope and protected B160 source
        run: node scripts/platform/connections/b164-integrity.mjs
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Association and reconciliation tests
        run: node --test tests/platformDemoAssociation.test.mjs tests/platformDemoReconciliation.test.mjs
      - name: Preserve HTTP origin boundary
        run: node --test scripts/platform/connections/origin.test.mjs
      - name: Full regression, Social release and Next build
        shell: bash
        run: |
          mkdir -p .jenios-b164-qa/ci
          set +e
          npm run build > .jenios-b164-qa/ci/build-and-tests.log 2>&1
          code=$?
          tail -n 70 .jenios-b164-qa/ci/build-and-tests.log
          if [ "$code" -ne 0 ]; then grep -n -B 4 -A 40 'not ok\|Error:\|Failed to compile' .jenios-b164-qa/ci/build-and-tests.log; fi
          exit "$code"
      - name: Start isolated local server
        shell: bash
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b164-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/integracoes; then exit 0; fi
            sleep 1
          done
          cat /tmp/jenios-b164-server.log
          exit 1
      - name: Preserve B160 guides and free assistants
        run: set -o pipefail; node scripts/platform/connections/browser-smoke.mjs 2>&1 | tee .jenios-b164-qa/ci/browser-guides.log
      - name: Preserve B148 Direct, boost and character preference
        run: set -o pipefail; node scripts/platform/b148-browser-smoke.mjs | tee .jenios-b164-qa/ci/browser-b148.log
      - name: Preserve Pro and University
        run: |
          set -euo pipefail
          node scripts/platform/b145-pro-ui-smoke.mjs | tee .jenios-b164-qa/ci/browser-pro.log
          node scripts/platform/b147-university-ui-smoke.mjs | tee .jenios-b164-qa/ci/browser-university.log
      - name: Archive public source and evidence
        if: success()
        run: |
          git archive --format=zip --output=.jenios-b164-qa/ci/JENIOS_B164_PUBLIC_SOURCE.zip HEAD
          git rev-parse HEAD > .jenios-b164-qa/ci/COMMIT.txt
          sha256sum .jenios-b164-qa/ci/JENIOS_B164_PUBLIC_SOURCE.zip > .jenios-b164-qa/ci/SHA256SUMS.txt
          git diff --stat dc320f8fcbec74d2ea1dcf923bed923bdf4377d9 HEAD > .jenios-b164-qa/ci/CHANGES.txt
      - name: Keep redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B164_DEMO_ASSOCIATION_CI
          path: .jenios-b164-qa/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
