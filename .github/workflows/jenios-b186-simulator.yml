name: JENIOS B186-B189 simulator, SQLite risk and reconciliation
on:
  push:
    branches:
      - fix/jenios-b185-simulator-e2e-20261020
      - fix/jenios-b187-b188-real-ledger-gates-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Initialize no-secret CI evidence
        run: |
          mkdir -p .jenios-b186-ci
          git rev-parse HEAD > .jenios-b186-ci/COMMIT.txt
      - name: B184 frozen baseline plus additive B185-B189 scope
        run: node scripts/platform/connections/b187-integrity.mjs
      - name: Simulated receipts and actual B152 SQLite E2E for three modes
        run: |
          node --test tests/platformB185PaperSimulator.test.mjs tests/platformB186LedgerReplay.test.mjs tests/platformB187PaperLedgerE2E.test.mjs
      - name: Existing original broker-paper security, risk and reconciliation regression
        run: |
          node --test tests/platformAlpacaPaper*.test.mjs tests/platformPilotPrep.test.mjs tests/platformNativeBrokerBridge.test.mjs
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression and Next production build
        run: |
          npm run build > .jenios-b186-ci/build.log 2>&1 || { tail -n 130 .jenios-b186-ci/build.log; exit 1; }
          tail -n 30 .jenios-b186-ci/build.log
      - name: Start localhost app
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b186.log 2>&1 &
          for i in $(seq 1 65); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/integracoes; then exit 0; fi
            sleep 1
          done
          tail -n 120 /tmp/jenios-b186.log
          exit 1
      - name: Guard no unapproved order execution route or secrets
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          for(const route of ['/integracoes','/api/platform/broker-readiness','/api/platform/broker-providers']){
            const response=await fetch('http://127.0.0.1:3127'+route);
            assert.equal(response.status,200,route);
            assert.doesNotMatch(await response.text(),/JENIOS_PAPER_WORKER_SIGNING_KEY_B64/);
          }
          assert.equal((await fetch('http://127.0.0.1:3127/api/platform/broker-execution',{method:'POST'})).status,404);
          JS
      - name: Browser smoke preserving Social, Pro, University, guide
        run: |
          node scripts/platform/connections/browser-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
          node scripts/platform/b145-pro-ui-smoke.mjs
          node scripts/platform/b147-university-ui-smoke.mjs
      - name: Archive public no-secret source on success
        if: success()
        run: |
          git archive --format=zip --output=.jenios-b186-ci/JENIOS_B189_SOURCE.zip HEAD
          sha256sum .jenios-b186-ci/JENIOS_B189_SOURCE.zip > .jenios-b186-ci/SHA256SUMS.txt
      - name: Preserve CI diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B189_SIMULATOR_SQLITE_CI
          path: .jenios-b186-ci/
          retention-days: 30
          if-no-files-found: error
