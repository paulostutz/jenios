name: JENIOS B190-B195 customer broker readiness and adverse Paper risk
on:
  push:
    branches:
      - fix/jenios-b190-b195-customer-paper-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      NEXT_PUBLIC_JENIOS_DEMO_CONNECTORS_UI: 'false'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Establish CI evidence folder
        run: |
          mkdir -p .jenios-b195-ci
          git rev-parse HEAD > .jenios-b195-ci/COMMIT.txt
      - name: Freeze B189 and guard no new real execution surface
        run: node scripts/platform/connections/b195-integrity.mjs
      - name: Test customer-owned broker activation and 3-mode adversarial SQLite runbook
        run: |
          node --test tests/platformB190CustomerActivation.test.mjs tests/platformB191B193Recovery.test.mjs tests/platformB194PerformanceGate.test.mjs
      - name: Confirm B185-B189 simulator and original brokerage risk regressions
        run: |
          node --test tests/platformB185PaperSimulator.test.mjs tests/platformB186LedgerReplay.test.mjs tests/platformB187PaperLedgerE2E.test.mjs
          node --test tests/platformAlpacaPaper*.test.mjs tests/platformPilotPrep.test.mjs tests/platformDemo*.test.mjs
      - name: Install existing pinned dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression, Social, Next production build
        run: |
          npm run build > .jenios-b195-ci/build.log 2>&1 || { tail -n 130 .jenios-b195-ci/build.log; exit 1; }
          tail -n 30 .jenios-b195-ci/build.log
      - name: Start no-secret localhost application
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b195.log 2>&1 &
          for i in $(seq 1 65); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/integracoes; then exit 0; fi
            sleep 1
          done
          tail -n 120 /tmp/jenios-b195.log
          exit 1
      - name: No order posting or credential intake enabled on production-like host
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const root='http://127.0.0.1:3127';
          for(const path of ['/integracoes','/api/platform/broker-providers','/api/platform/broker-readiness']){
            const response=await fetch(root+path);
            assert.equal(response.status,200,path);
            const body=await response.text();
            assert.doesNotMatch(body,/JENIOS_DEMO_VAULT_KEY_B64|JENIOS_PAPER_WORKER_SIGNING_KEY_B64/);
          }
          assert.equal((await fetch(root+'/api/platform/broker-connections')).status,404);
          assert.equal((await fetch(root+'/api/platform/broker-execution',{method:'POST'})).status,404);
          console.log('NO_PUBLIC_TRADING_ROUTE_PASS');
          JS
      - name: Browser controls and existing Social/Gênios/Universidade untouched
        run: |
          node scripts/platform/connections/browser-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
          node scripts/platform/b145-pro-ui-smoke.mjs
          node scripts/platform/b147-university-ui-smoke.mjs
      - name: Archive public source and hashes
        if: success()
        run: |
          git archive --format=zip --output=.jenios-b195-ci/JENIOS_B195_PUBLIC_SOURCE.zip HEAD
          sha256sum .jenios-b195-ci/JENIOS_B195_PUBLIC_SOURCE.zip > .jenios-b195-ci/SHA256SUMS.txt
      - name: Preserve visible evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B195_CUSTOMER_PAPER_CI
          path: .jenios-b195-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
