name: JENIOS B196-B200 broker preflight and launch readiness
on:
  push:
    branches: [fix/jenios-b196-b200-pilot-readiness-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      NEXT_PUBLIC_JENIOS_DEMO_CONNECTORS_UI: 'false'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_PRIVATE_PAPER_ACCOUNT_PREFLIGHT: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Initialize no-secret evidence
        run: |
          mkdir -p .jenios-b200-ci
          git rev-parse HEAD > .jenios-b200-ci/COMMIT.txt
      - name: Verify B195 preservation and B196-B200 additive scope
        run: node scripts/platform/connections/b200-integrity.mjs
      - name: New protected private Paper, order, watchdog, commerce audit tests
        run: |
          node --test tests/platformB196PrivateAccountPreflight.test.mjs tests/platformB197PairedPaperReads.test.mjs tests/platformB198ProtectionWatchdog.test.mjs tests/platformB199ReleaseMatrix.test.mjs
      - name: Preserve prior B190-B195 and B185-B189 behavior
        run: |
          node --test tests/platformB190CustomerActivation.test.mjs tests/platformB191B193Recovery.test.mjs tests/platformB194PerformanceGate.test.mjs
          node --test tests/platformB185PaperSimulator.test.mjs tests/platformB186LedgerReplay.test.mjs tests/platformB187PaperLedgerE2E.test.mjs
      - name: Original Alpaca, risk and read-only demo regression
        run: node --test tests/platformAlpacaPaper*.test.mjs tests/platformPilotPrep.test.mjs tests/platformDemo*.test.mjs
      - name: Install exactly pinned dependencies, no scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full Next build, entire suite and S05 Social release
        run: |
          npm run build > .jenios-b200-ci/build.log 2>&1 || { tail -n 130 .jenios-b200-ci/build.log; exit 1; }
          tail -n 32 .jenios-b200-ci/build.log
      - name: Serve localhost with disabled demo APIs
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b200.log 2>&1 &
          for i in $(seq 1 65); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/integracoes; then exit 0; fi
            sleep 1
          done
          tail -n 130 /tmp/jenios-b200.log
          exit 1
      - name: Verify no public broker POST or private credentials
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const root='http://127.0.0.1:3127';
          for(const path of ['/integracoes','/api/platform/broker-providers','/api/platform/broker-readiness']){
            const result=await fetch(root+path);
            assert.equal(result.status,200,path);
            assert.doesNotMatch(await result.text(),/JENIOS_DEMO_VAULT_KEY_B64|JENIOS_PAPER_WORKER_SIGNING_KEY_B64/);
          }
          assert.equal((await fetch(root+'/api/platform/broker-connections')).status,404);
          assert.equal((await fetch(root+'/api/platform/broker-execution',{method:'POST'})).status,404);
          console.log('B200_NO_PUBLIC_ORDER_ROUTE_PASS');
          JS
      - name: Browser regression of guides, Social, Gênios and University
        run: |
          node scripts/platform/connections/browser-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
          node scripts/platform/b145-pro-ui-smoke.mjs
          node scripts/platform/b147-university-ui-smoke.mjs
      - name: Archive no-secret public source and SHA256
        if: success()
        run: |
          git archive --format=zip --output=.jenios-b200-ci/JENIOS_B200_PUBLIC_SOURCE.zip HEAD
          sha256sum .jenios-b200-ci/JENIOS_B200_PUBLIC_SOURCE.zip > .jenios-b200-ci/SHA256SUMS.txt
      - name: Upload technical evidence even if validation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B200_PAPER_RELEASE_CI
          path: .jenios-b200-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
