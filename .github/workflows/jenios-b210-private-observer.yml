name: JENIOS B206-B210 isolated read-only Paper worker
on:
  push:
    branches: [fix/jenios-b206-b210-readonly-worker-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      NEXT_PUBLIC_JENIOS_DEMO_CONNECTORS_UI: 'false'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_PRIVATE_PAPER_ACCOUNT_PREFLIGHT: 'false'
      JENIOS_PRIVATE_PAPER_READ_OBSERVER: 'false'
      JENIOS_PRIVATE_PAPER_OBSERVER_WORKER: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare no-secret evidence
        run: |
          mkdir -p .jenios-b210-ci
          git rev-parse HEAD > .jenios-b210-ci/COMMIT.txt
      - name: Freeze B205 scope and reject HTTP trading surface
        run: node scripts/platform/connections/b210-integrity.mjs
      - name: B206-B210 isolated runtime, signed read grants, durable SQLite and E2E GET-only worker
        run: |
          node --test tests/platformB206PrivateReadBoundary.test.mjs tests/platformB207DurableAuditJournal.test.mjs tests/platformB208PrivateObserverWorker.test.mjs tests/platformB209PrivateObserverCLI.test.mjs
      - name: Regress B201-B205 and earlier Paper simulator risk/reconciliation
        run: |
          node --test tests/platformB201PrivatePaperReader.test.mjs tests/platformB202B203PrivateRecoveryAudit.test.mjs tests/platformB204RedactedPaperReview.test.mjs tests/platformB205PrivateObserverChain.test.mjs
          node --test tests/platformB196PrivateAccountPreflight.test.mjs tests/platformB197PairedPaperReads.test.mjs tests/platformB198ProtectionWatchdog.test.mjs tests/platformB199ReleaseMatrix.test.mjs
          node --test tests/platformB190CustomerActivation.test.mjs tests/platformB191B193Recovery.test.mjs tests/platformB194PerformanceGate.test.mjs
          node --test tests/platformB185PaperSimulator.test.mjs tests/platformB186LedgerReplay.test.mjs tests/platformB187PaperLedgerE2E.test.mjs
          node --test --test-concurrency=1 tests/platformAlpacaPaper*.test.mjs tests/platformPilotPrep.test.mjs tests/platformDemo*.test.mjs
      - name: Install pinned dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression and Next production build
        run: |
          npm run build > .jenios-b210-ci/build.log 2>&1 || { tail -n 130 .jenios-b210-ci/build.log; exit 1; }
          tail -n 25 .jenios-b210-ci/build.log
      - name: Launch localhost with external credentials and actions disabled
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b210-next.log 2>&1 &
          for i in $(seq 1 65); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/integracoes; then exit 0; fi
            sleep 1
          done
          tail -n 120 /tmp/jenios-b210-next.log
          exit 1
      - name: Confirm no public broker submission and no secret exposure
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const root='http://127.0.0.1:3127';
          for(const path of ['/integracoes','/api/platform/broker-providers','/api/platform/broker-readiness']){
            const response=await fetch(root+path);assert.equal(response.status,200,path);
            assert.doesNotMatch(await response.text(),/JENIOS_DEMO_VAULT_KEY_B64|JENIOS_PAPER_OBSERVER_KEY_B64|JENIOS_PAPER_WORKER_SIGNING_KEY_B64/);
          }
          assert.equal((await fetch(root+'/api/platform/broker-connections')).status,404);
          for(const path of ['/api/platform/broker-execution','/api/platform/paper-execution',
            '/api/platform/live-trading','/api/platform/private-observer']){
            assert.equal((await fetch(root+path,{method:'POST'})).status,404,path);
          }
          console.log('B210_PUBLIC_BROKER_EXECUTION_BLOCKED');
          JS
      - name: Preserve guides Social Gênios Pro and University browser flows
        run: |
          node scripts/platform/connections/browser-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
          node scripts/platform/b145-pro-ui-smoke.mjs
          node scripts/platform/b147-university-ui-smoke.mjs
      - name: Archive certified no-secret public source
        if: success()
        run: |
          git archive --format=zip --output=.jenios-b210-ci/JENIOS_B210_PUBLIC_SOURCE.zip HEAD
          sha256sum .jenios-b210-ci/JENIOS_B210_PUBLIC_SOURCE.zip > .jenios-b210-ci/SHA256SUMS.txt
      - name: Preserve evidence even if CI fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B210_PRIVATE_GET_ONLY_WORKER_CI
          path: .jenios-b210-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
