name: JENIOS B216-B230 consolidated launch candidate QA
on:
  push:
    branches: [fix/jenios-b216-b230-consolidated-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_PRIVATE_PAPER_OBSERVER_WORKER: 'false'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      NEXT_PUBLIC_JENIOS_DEMO_CONNECTORS_UI: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Initialize artifact evidence
        run: |
          mkdir -p .jenios-b230-ci
          git rev-parse HEAD > .jenios-b230-ci/COMMIT.txt
      - name: Protect B215-R2 and limit B216-B230 to new QA modules
        run: node scripts/platform/launch/b230-integrity.mjs
      - name: Test fifteen checkpoints plus end-to-end launch guard
        run: node --test tests/platformB21[6-9]*.test.mjs tests/platformB22*.test.mjs tests/platformB230*.test.mjs
      - name: Preserve prior brokerage/security and synthetic financial regression
        run: |
          node --test tests/platformB211AdapterAttestation.test.mjs tests/platformB212WorkerAuditHealth.test.mjs tests/platformB213HostReadiness.test.mjs tests/platformB214HostHealthCLI.test.mjs
          node --test tests/platformB206PrivateReadBoundary.test.mjs tests/platformB207DurableAuditJournal.test.mjs tests/platformB208PrivateObserverWorker.test.mjs tests/platformB209PrivateObserverCLI.test.mjs
          node --test --test-concurrency=1 tests/platformAlpacaPaper*.test.mjs tests/platformPilotPrep.test.mjs tests/platformDemo*.test.mjs
          node --test tests/platformB94RollingPaperValidation.test.mjs tests/platformB86SubscriptionLifecycle.test.mjs tests/platformB81SubscriptionPreflight.test.mjs
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression, Social S05 and production-type Next build
        run: |
          npm run build > .jenios-b230-ci/build.log 2>&1 || { tail -n 140 .jenios-b230-ci/build.log; exit 1; }
          tail -n 35 .jenios-b230-ci/build.log
      - name: Start safe localhost with external actions disabled
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b230.log 2>&1 &
          for i in $(seq 1 65); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/integracoes; then exit 0; fi
            sleep 1
          done
          tail -n 130 /tmp/jenios-b230.log
          exit 1
      - name: Block broker submission and credential intake on public app
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const root='http://127.0.0.1:3127';
          for(const path of ['/integracoes','/api/platform/broker-providers','/api/platform/broker-readiness']){
            const r=await fetch(root+path);assert.equal(r.status,200,path);
            assert.doesNotMatch(await r.text(),/JENIOS_PAPER_OBSERVER_KEY_B64|INTER_CLIENT_SECRET|JENIOS_DEMO_VAULT_KEY_B64/);
          }
          for(const path of ['/api/platform/broker-execution','/api/platform/private-observer',
            '/api/platform/paper-execution','/api/platform/live-trading']){
            assert.equal((await fetch(root+path,{method:'POST'})).status,404,path);
          }
          assert.equal((await fetch(root+'/api/platform/broker-connections')).status,404);
          console.log('B230_BROKER_EXECUTION_AND_PUBLIC_VAULT_BLOCKED');
          JS
      - name: Existing integration Social Gênios and Universidade browser regression
        run: |
          node scripts/platform/connections/browser-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
          node scripts/platform/b145-pro-ui-smoke.mjs
          node scripts/platform/b147-university-ui-smoke.mjs
      - name: Generate redacted release candidate decision
        run: node scripts/platform/launch/b229-offline-release-report.mjs --offline > .jenios-b230-ci/RELEASE_QA.json
      - name: Archive public source plus checksum
        if: success()
        run: |
          git archive --format=zip --output=.jenios-b230-ci/JENIOS_B230_PUBLIC_SOURCE.zip HEAD
          sha256sum .jenios-b230-ci/JENIOS_B230_PUBLIC_SOURCE.zip > .jenios-b230-ci/SHA256SUMS.txt
      - name: Preserve evidence even after a failed check
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B230_RELEASE_CANDIDATE_CI
          path: .jenios-b230-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
