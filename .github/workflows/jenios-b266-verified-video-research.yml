name: JENIOS B266 verified captions and protected education research
on:
  push:
    branches: [fix/jenios-b266-verified-video-research-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      NEXT_PUBLIC_JENIOS_DEMO_CONNECTORS_UI: 'false'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_PRIVATE_PAPER_ACCOUNT_PREFLIGHT: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_QA_CANDIDATE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare no-secret evidence
        run: |
          mkdir -p .jenios-b266-ci
          git rev-parse HEAD > .jenios-b266-ci/COMMIT.txt
      - name: Protect B260 certified source
        run: node scripts/platform/learning/b266-integrity.mjs
      - name: Direct access, old histories, studies, indicators and hypotheses
        run: |
          node --test tests/learningR26.test.mjs tests/jeniosUniversityCompletionB141.test.mjs tests/jeniosUniversityDailyB130.test.mjs tests/jeniosUniversityFreeTracksVideoB261.test.mjs tests/platformTradingVideoStudy.test.mjs
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression including Social S05 and Next production build
        run: |
          npm run build > .jenios-b266-ci/build.log 2>&1 || { tail -n 150 .jenios-b266-ci/build.log; exit 1; }
          tail -n 35 .jenios-b266-ci/build.log
      - name: Start localhost with broker and payment capabilities off
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b265-next.log 2>&1 &
          for i in $(seq 1 65); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/universidade; then exit 0; fi
            sleep 1
          done
          tail -n 100 /tmp/jenios-b265-next.log
          exit 1
      - name: Audit public reading UX and deny broker execution
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const root='http://127.0.0.1:3127';
          const r=await fetch(root+'/universidade');assert.equal(r.status,200);
          const text=await r.text();assert.match(text,/Escolha livremente onde começar/);
          for(const path of ['/api/platform/broker-execution','/api/platform/paper-execution','/api/platform/live-trading'])
            assert.equal((await fetch(root+path,{method:'POST'})).status,404,path);
          assert.equal((await fetch(root+'/api/platform/broker-connections')).status,404);
          const checkout=await fetch(root+'/api/platform/checkout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
          assert.notEqual(checkout.status,200);
          console.log('B266_FREE_STUDY_PUBLIC_BOUNDARY_PASS');
          JS
      - name: Preserve Social, Pro, University and integrations browser regressions
        run: |
          node scripts/platform/connections/browser-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
          node scripts/platform/b145-pro-ui-smoke.mjs
          node scripts/platform/b147-university-ui-smoke.mjs
      - name: Archive public no-secret source and SHA256
        if: success()
        run: |
          git archive --format=zip --output=.jenios-b266-ci/JENIOS_B266_PUBLIC_SOURCE.zip HEAD
          sha256sum .jenios-b266-ci/JENIOS_B266_PUBLIC_SOURCE.zip > .jenios-b266-ci/SHA256SUMS.txt
      - name: Keep diagnostics on any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B266_VERIFIED_VIDEO_RESEARCH_CI
          path: .jenios-b266-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
