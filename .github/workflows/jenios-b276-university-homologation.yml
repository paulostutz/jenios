name: JENIOS B276 University isolated acceptance and preservation
on:
  push:
    branches: [fix/jenios-b276-university-homologation-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_QA_CANDIDATE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Check B275 scope frozen and B276 acceptance
        run: |
          node scripts/platform/learning/b276-integrity.mjs
          node --test tests/jeniosB276UniversityAcceptance.test.mjs tests/jeniosUniversityFreeTracksVideoB261.test.mjs tests/jeniosB271B275LearningResearch.test.mjs tests/jeniosUniversityCompletionB141.test.mjs
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete build, test regression and release S05
        run: npm run build
      - name: Start private localhost and test guest + mobile browsers
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b276.log 2>&1 &
          for i in $(seq 1 65); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/universidade; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3127/universidade
          node scripts/platform/b147-university-ui-smoke.mjs
          node scripts/platform/learning/b276-browser-smoke.mjs
      - name: Preserve certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B276_UNIVERSITY_HOMOLOGATION
          path: |
            docs/learning/B276-UNIVERSITY-HOMOLOGATION.md
            scripts/platform/learning/b276-integrity.mjs
          retention-days: 30
