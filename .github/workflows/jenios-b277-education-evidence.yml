name: JENIOS B277 source evidence and University deep study
on:
  push:
    branches: [fix/jenios-b277-source-research-university-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_QA_CANDIDATE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Preserve B276-R2 and validate all source evidence claims
        run: |
          node scripts/platform/learning/b277-integrity.mjs
          node --test tests/jeniosB277SourceEvidenceUniversity.test.mjs tests/jeniosUniversityHomologationB276R2.test.mjs tests/jeniosB276UniversityAcceptance.test.mjs tests/jeniosUniversityFreeTracksVideoB261.test.mjs tests/jeniosTradeVideosSupplementB266.test.mjs tests/jeniosB271B275LearningResearch.test.mjs tests/platformTradingVideoStudy.test.mjs
      - name: Install exact dependencies with lifecycle scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression and Next.js production-type build
        run: npm run build
      - name: Launch localhost with payments, robots and API executors disabled
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b277.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/universidade; then exit 0; fi
            sleep 1
          done
          tail -n 100 /tmp/jenios-b277.log
          exit 1
      - name: Authenticated University mobile and browser regression
        run: |
          node scripts/platform/learning/b276r2-browser-acceptance.mjs
          node scripts/platform/b147-university-ui-smoke.mjs
          node scripts/platform/learning/b276-browser-smoke.mjs
      - name: Preserve Gênios, Social and broker-browser regressions
        run: |
          node scripts/platform/b145-pro-ui-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
          node scripts/platform/connections/browser-smoke.mjs
      - name: Archive provenance report and scope checks regardless of outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B277_SOURCE_STUDIES_CI
          path: |
            docs/learning/B277-VIDEOS-STUDIES-TRIAGE.md
            scripts/platform/learning/b277-integrity.mjs
          retention-days: 30
