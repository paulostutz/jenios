name: JENIOS B280 forward research protocol and first precommitted future hour
on:
  push:
    branches: [fix/jenios-b280-prospective-protocol-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_QA_CANDIDATE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Preserve B279 and reject trading, PAY, Social and curriculum drift
        run: node scripts/platform/research/b280-integrity.mjs
      - name: Validate prospective UTC causal contract and statistical review gates
        run: |
          node --test tests/platformB280ForwardProtocol.test.mjs tests/platformB279RetrospectiveReplay.test.mjs tests/platformB278HistoricalIngest.test.mjs tests/platformTradingVideoStudy.test.mjs
      - name: Attempt first public-source forward research registration
        id: forward_capture
        continue-on-error: true
        run: node scripts/platform/research/b280-capture-future-hour.mjs
      - name: Distinguish code CI from separately witnessed future capture
        if: always()
        run: |
          echo "B280_FORWARD_CAPTURE_STEP_OUTCOME=${{ steps.forward_capture.outcome }}"
          echo "A green build does not prove future performance or even successful source registration."
      - name: Install exact lockfile with lifecycle scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all regression tests and Next.js production-type build
        run: npm run build
      - name: Archive read-only forecast or explicit fail-closed outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B280_FORWARD_RESEARCH_CI
          path: |
            .jenios-b280-ci/
            docs/platform/B280-PROSPECTIVE-PROTOCOL.md
            scripts/platform/research/b280-integrity.mjs
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
