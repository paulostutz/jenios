name: JENIOS B286-B288 isolated integrated release candidate
on:
  push:
    branches: [fix/jenios-b286-b288-integrated-release-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_SALES_GENERATIVE_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
      JENIOS_PAY_PROVIDER: disabled
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Integration safety gates
        run: node --test tests/jeniosB286B288ReleaseCandidate.test.mjs tests/jeniosB285R2IntegratedSandbox.test.mjs tests/jeniosB282B284SalesInter.test.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression and build
        run: npm run build
      - name: Localhost smoke server
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 >/tmp/jenios-b288.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/lp; then exit 0; fi
            sleep 1
          done
          tail -n 80 /tmp/jenios-b288.log
          exit 1
      - name: Browser sales, LP and Platform
        run: node scripts/platform/b284-sales-browser-smoke.mjs
      - name: Archive release checklist
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B288_RELEASE_CANDIDATE_QA
          path: docs/platform/B286-B288-RELEASE-CANDIDATE.md
          retention-days: 30
