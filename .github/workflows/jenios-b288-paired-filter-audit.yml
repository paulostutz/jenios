name: JENIOS B288 three-mode paired cost and filter research
on:
  push:
    branches: [fix/jenios-b288-paired-filter-cost-stress-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_QA_CANDIDATE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Ensure no protected modules changed
        run: node scripts/platform/research/b288-integrity.mjs
      - name: Validate B288, B287 and original historical/no-lookahead contracts
        run: |
          node --test tests/platformB288PairedFilterAudit.test.mjs tests/platformB287SignalWitness.test.mjs tests/platformB281FirstHourObservation.test.mjs tests/platformB280ForwardProtocol.test.mjs tests/platformB279RetrospectiveReplay.test.mjs
      - name: Install exact dependencies and run full regressions / Next build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Preserve research checkpoint for audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B288_PAIRED_RESEARCH_EVIDENCE
          path: |
            docs/platform/B288-PAIRED-THREE-MODE-VALIDATION.md
            scripts/platform/research/b288-integrity.mjs
            lib/platform/research/b288-paired-filter-audit.mjs
            tests/platformB288PairedFilterAudit.test.mjs
          retention-days: 30
          if-no-files-found: error
