name: JENIOS B289 operator reversal mega trend offline research
on:
  push:
    branches: [fix/jenios-b289-reverse-operator-stress-lab-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Validate operator profiles and mega trend veto
        run: node --test tests/platformB289OperatorReversal.test.mjs tests/platformB288PairedFilterAudit.test.mjs tests/platformB287SignalWitness.test.mjs
      - name: Full regressions and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Archive B289 research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B289_OPERATOR_REVERSAL_RESEARCH
          path: |
            lib/platform/research/b289-operator-reversal-lab.mjs
            tests/platformB289OperatorReversal.test.mjs
            docs/platform/B289-OPERATOR-REVERSAL.md
          retention-days: 30
