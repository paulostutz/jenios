name: JENIOS B291 three commercial modes and hybrid copilot contracts
on:
  push:
    branches: [fix/jenios-b291-three-mode-copilot-contract-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Validate three-mode contract and previous B290 B289 research
        run: node --test tests/platformB291ThreeModeCopilot.test.mjs tests/platformB290InversionSignalContract.test.mjs tests/platformB289OperatorReversal.test.mjs
      - name: Full regression and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B291_THREE_MODE_COPILOT_EVIDENCE
          path: |
            lib/platform/research/b291-three-mode-copilot.mjs
            tests/platformB291ThreeModeCopilot.test.mjs
            docs/platform/B291-THREE-MODE-COPILOT.md
          retention-days: 30
