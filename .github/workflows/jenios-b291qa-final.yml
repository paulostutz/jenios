name: JENIOS B291 integrated QA release and strict Preview isolation
on:
  push:
    branches: [fix/jenios-b291qa-launch-candidate-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_QA_STRICT_SUBSCRIPTION_PROOF: 'false'
      JENIOS_PAY_PROVIDER: disabled
      JENIOS_SALES_GENERATIVE_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRO_GENERATION_ENABLED: 'false'
      JENIOS_PRO_PAYMENTS_ENABLED: 'false'
      JENIOS_QA_CANDIDATE_ENABLED: 'false'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify QA database, financial access and release boundaries
        run: |
          node scripts/platform/b291-integrity.mjs
          node --test tests/jeniosB291QaPreviewRelease.test.mjs tests/jeniosB290QaFinancialProof.test.mjs tests/jeniosB289QaSchema.test.mjs tests/jeniosB285R2IntegratedSandbox.test.mjs tests/jeniosB282B284SalesInter.test.mjs
      - name: Reproducible dependency install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full JENIOS/Social regressions and Next.js build
        run: npm run build
      - name: Start isolated local application
        run: |
          nohup node_modules/.bin/next start -H 127.0.0.1 -p 3127 > /tmp/jenios-b291qa.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/lp; then exit 0; fi
            sleep 1
          done
          tail -n 100 /tmp/jenios-b291qa.log
          exit 1
      - name: Authenticate denials and public catalog HTTP checks
        run: node scripts/platform/b291-qa-public-acceptance.mjs
      - name: Browser Gênios, sales, mobile and Platform access
        run: |
          node scripts/platform/b284-sales-browser-smoke.mjs
          node scripts/platform/b148-browser-smoke.mjs
      - name: University/learning visitor and responsive UI
        run: |
          node scripts/platform/b147-university-ui-smoke.mjs
          node scripts/platform/learning/b276-browser-smoke.mjs
      - name: Archive release candidate evidence, never keys or price history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B291_QA_INTEGRATED_LAUNCH
          path: |
            docs/platform/B289-QA-SCHEMA-ISOLATED.md
            docs/platform/B290-QA-FINANCIAL-PROOF.md
            docs/platform/B291-QA-INTEGRATED-LAUNCH-CANDIDATE.md
            scripts/platform/b291-integrity.mjs
          retention-days: 30
