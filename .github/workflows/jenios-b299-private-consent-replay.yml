name: JENIOS B299 consent replay read-only gate
on:
  push:
    branches: [fix/jenios-b299-private-consent-replay-gate-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only B299 and previous contract tests; fixtures only
        run: |
          node --test \
            tests/platformB299PrivateConsentReplayJournal.test.mjs \
            tests/platformB298SignedEvidenceAudit.test.mjs \
            tests/platformB297PrivateReadOnlyAudit.test.mjs \
            tests/platformB295PrivateRunnerAttestation.test.mjs \
            tests/platformB290InversionSignalContract.test.mjs \
            tests/platformB197PairedPaperReads.test.mjs
      - name: Complete regression and compile Next
        run: npm run build
      - name: Archive non-proprietary B299 contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B299_PRIVATE_CONSENT_REPLAY_CI
          path: |
            lib/platform/research/b299-private-consent-replay-journal.mjs
            scripts/platform/research/b299-private-consent-replay-intake.mjs
            tests/platformB299PrivateConsentReplayJournal.test.mjs
            docs/platform/B299-PRIVATE-CONSENT-REPLAY-JOURNAL.md
          retention-days: 30