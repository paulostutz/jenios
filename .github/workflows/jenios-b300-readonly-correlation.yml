name: JENIOS B300 signed evidence correlation NO-GO
on:
  push:
    branches: [fix/jenios-b300-private-evidence-correlation-gate-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install only dependencies required for test and build
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: B300 and prior isolated contract tests (fixtures only)
        run: |
          node --test \
            tests/platformB300EvidenceReconciliationGate.test.mjs \
            tests/platformB299PrivateConsentReplayJournal.test.mjs \
            tests/platformB298SignedEvidenceAudit.test.mjs \
            tests/platformB297PrivateReadOnlyAudit.test.mjs \
            tests/platformB295PrivateRunnerAttestation.test.mjs \
            tests/platformB290InversionSignalContract.test.mjs \
            tests/platformB197PairedPaperReads.test.mjs
      - name: Regression plus Next.js compile, never deploy
        run: npm run build
      - name: Archive non-proprietary B300 evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B300_PRIVATE_READONLY_CORRELATION_CI
          path: |
            lib/platform/research/b300-evidence-reconciliation-gate.mjs
            scripts/platform/research/b300-review-private-cohort.mjs
            tests/platformB300EvidenceReconciliationGate.test.mjs
            docs/platform/B300-READONLY-CORRELATION-GATE.md
          retention-days: 30