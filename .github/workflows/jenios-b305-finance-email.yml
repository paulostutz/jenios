            app/components/platform/PlatformAdminAccess.js
            lib/platform/admin-session.mjs
            lib/social/session-fence.mjs
            tests/platformAdminSessionR39.test.mjs
            tests/jeniosMasterUsersB129.test.mjs
            docs/platform/B305-R39-ADMIN-SESSION-REVOCATION.md
            artifacts/jenios-r39-session.tap
