            app/components/InterAdminPanel.js
            app/components/InterSetupForm.js
            lib/pay/inter-vault.mjs
            lib/pay/inter-pix.mjs
            lib/assistant/university-subscription.mjs
            lib/email/production-delivery-policy.mjs
