name: JENIOS B305 finance email isolated certification
on:
  push:
    branches: [fix/jenios-b305-finance-email-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
      JENIOS_PAYMENT_EMAILS_ENABLED: 'false'
      JENIOS_B305_PRIVATE_EMAIL_RUNNER_ENABLED: 'false'
      JENIOS_SUBSCRIPTION_DUNNING_ENABLED: 'false'
      JENIOS_TRANSACTIONAL_EMAILS_ENABLED: 'false'
      JENIOS_B305_TEST_SEND_APPROVED: 'false'
      JENIOS_MARKETING_EMAILS_ENABLED: 'false'
      JENIOS_MARKETING_PLANNER_ENABLED: 'false'
      JENIOS_RESEND_WEBHOOK_ENABLED: 'false'
      JENIOS_AUTH_TEMPLATES_APPLIED: 'false'
      JENIOS_RESEND_WEBHOOK_ENDPOINT_CERTIFIED: 'false'
      JENIOS_MARKETING_DELIVERY_WORKER_CERTIFIED: 'false'
      JENIOS_UNIVERSITY_MILESTONE_DELIVERY_CERTIFIED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: B305 finance email template and guards
        run: node --test tests/jeniosB305FinanceEmail.test.mjs tests/jeniosB305OutboxWorker.test.mjs tests/jeniosB305PrivateRunner.test.mjs tests/jeniosB305ReadinessDiagnostic.test.mjs tests/jeniosB305Dunning.test.mjs tests/jeniosB305DunningRoute.test.mjs tests/jeniosB305LifecycleCampaigns.test.mjs tests/jeniosB305TransactionalDelivery.test.mjs tests/emailPublicCopyB305.test.mjs tests/jeniosB305AuthLifecycleEmails.test.mjs tests/jeniosB305OnboardingBridge.test.mjs tests/jeniosB305SubscriptionLifecycleEmails.test.mjs tests/jeniosB305MarketingPlanner.test.mjs tests/jeniosB305NonFinancialLifecycle.test.mjs tests/jeniosB305UniversityMilestones.test.mjs tests/jeniosB305EmailAdminHealth.test.mjs tests/jeniosB305ResendSuppressionLedger.test.mjs tests/jeniosB305EmailObservability.test.mjs tests/jeniosB305EmailReleaseReadiness.test.mjs tests/jeniosB305UniversityDeliveryEvidence.test.mjs tests/jeniosB305UniversityMessageAdapter.test.mjs tests/jeniosB305MarketingMessageAdapter.test.mjs tests/jeniosB305FinanceOutboxIndex.test.mjs tests/jeniosB305EmailPreflightSql.test.mjs
      - name: Full regression and Next build with real sending disabled
        run: npm run build
      - name: Archive scoped technical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B305_FINANCE_EMAIL_ISOLATED
          path: |
            docs/platform/B305-FINANCE-BRANDED-EMAILS.md
            lib/email/jenios-identity.mjs
            lib/email/finance-payment-confirmation.mjs
            lib/email/finance-outbox-worker.mjs
            lib/email/finance-private-runner.mjs
            lib/email/finance-readiness-diagnostic.mjs
            lib/email/subscription-dunning.mjs
            lib/email/lifecycle-campaigns.mjs
            lib/email/marketing-policy.mjs
            lib/email/transactional-delivery-worker.mjs
            lib/email/admin-health.mjs
            app/api/internal/email/transactional/route.js
            app/api/internal/billing/dunning/route.js
            app/api/internal/email/marketing-plan/route.js
            app/api/social/email-preferences/route.js
            app/api/admin/email-health/route.js
            app/admin/emails/page.js
            app/preferencias/page.js
            supabase/migrations/20261022220500_jenios_b305_subscription_dunning.sql
            supabase/migrations/20261022221000_jenios_b305_marketing_preferences.sql
            supabase/migrations/20261023002614_jenios_b305_transactional_delivery.sql
