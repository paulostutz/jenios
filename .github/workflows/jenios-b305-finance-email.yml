            docs/platform/B305-R40-INTER-SETUP-AND-DELIVERY.md
            artifacts/jenios-r40-integration.tap
          retention-days: 30
      - name: Archive complete R40 source with commit and checksum
        if: success()
        run: |
          mkdir -p artifacts/r40-source
          git archive --format=zip --output=artifacts/r40-source/JENIOS_B305_R40_SOURCE.zip HEAD
          git rev-parse HEAD > artifacts/r40-source/COMMIT.txt
          cd artifacts/r40-source
          sha256sum JENIOS_B305_R40_SOURCE.zip > SHA256SUMS.txt
      - name: Preserve complete R40 source backup
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B305_R40_FULL_SOURCE
          path: artifacts/r40-source/
          retention-days: 30
          if-no-files-found: error
