name: JENIOS FC05 local integrated UI homologation
on:
  push:
    branches: [research/jenios-fc05-integrated-homologation-20261023]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_DEMO_CONNECTORS_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_PRO_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
      JENIOS_PAYMENT_EMAILS_ENABLED: 'false'
      JENIOS_B305_PRIVATE_EMAIL_RUNNER_ENABLED: 'false'
      JENIOS_SUBSCRIPTION_DUNNING_ENABLED: 'false'
      JENIOS_TRANSACTIONAL_EMAILS_ENABLED: 'false'
      JENIOS_B305_TEST_SEND_APPROVED: 'false'
      JENIOS_MARKETING_EMAILS_ENABLED: 'false'
      JENIOS_MARKETING_PLANNER_ENABLED: 'false'
      JENIOS_RESEND_WEBHOOK_ENABLED: 'false'
      JENIOS_AUTH_TEMPLATES_APPLIED: 'false'
      JENIOS_RESEND_WEBHOOK_ENDPOINT_CERTIFIED: 'false'
      JENIOS_MARKETING_DELIVERY_WORKER_CERTIFIED: 'false'
      JENIOS_UNIVERSITY_MILESTONE_DELIVERY_CERTIFIED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify certified source preservation
        run: node scripts/platform/verify-fc03-sources.mjs && node scripts/platform/verify-fc05-sources.mjs
      - name: R12 through R59 plus R46 temporal variant
        run: node --test tests/platformRobotR59FinalCertification.test.mjs tests/platformRobotR58ReverseFinalStress.test.mjs tests/platformRobotR57HybridFinalAlignment.test.mjs tests/platformRobotR56ManualFinalAdvisory.test.mjs tests/platformRobotR55LongSessionStress.test.mjs tests/platformRobotR54LargeHorizonMultiwindow.test.mjs tests/platformRobotR53DynamicAssetSelection.test.mjs tests/platformRobotR52MarketSymbolLifecycle.test.mjs tests/platformRobotR51ChaosSoakIntegrated.test.mjs tests/platformRobotR50EconomicShockCliffs.test.mjs tests/platformRobotR49OrderReconciliationRaces.test.mjs tests/platformRobotR48ReconnectBackpressure.test.mjs tests/platformRobotR47MarketdataFreshnessFence.test.mjs tests/platformRobotR46LeaseClockskewHandoff.test.mjs tests/platformRobotR45LeaderFencing.test.mjs tests/platformRobotR44SplitbrainReconvergence.test.mjs tests/platformRobotR43QuorumCheckpoint.test.mjs tests/platformRobotR42RollbackProtection.test.mjs tests/platformRobotR41IntegrityAtomicCheckpoint.test.mjs tests/platformRobotR40FailclosedSnapshot.test.mjs tests/platformRobotR39StateRestoreSessionRotation.test.mjs tests/platformRobotR38MultistreamExpiry.test.mjs tests/platformRobotR37OrderedIngestion.test.mjs tests/platformRobotR36IdempotencyConcurrency.test.mjs tests/platformRobotR35MultisessionRecovery.test.mjs tests/platformRobotR34HoldoutSessionReauth.test.mjs tests/platformRobotR33HysteresisSessionRisk.test.mjs tests/platformRobotR32LongrunInterlockHoldout.test.mjs tests/platformRobotR31RecoveryRegimeInterlock.test.mjs tests/platformRobotR30RegimeAdaptiveGate.test.mjs tests/platformRobotR29BreakevenHoldout.test.mjs tests/platformRobotR28BreakevenRecall.test.mjs tests/platformRobotR27DynamicBreakeven.test.mjs tests/platformRobotR26FeeEvidenceRecovery.test.mjs tests/platformRobotR25ExchangeCostOutageStress.test.mjs tests/platformRobotR24MasterPerformanceLedger.test.mjs tests/platformRobotR23MultiwindowUltrafast.test.mjs tests/platformRobotR22PublicRankingHoldout.test.mjs tests/platformRobotR21OosUltrafastRanking.test.mjs tests/platformRobotR20ExecutionMicrostructure.test.mjs tests/platformRobotR19IntegratedRefinement.test.mjs tests/platformRobotR18UltrafastFoundation.test.mjs tests/platformRobotR17DecisionQuality.test.mjs tests/platformRobotR17SanitizedResults.test.mjs tests/platformRobotR16ExtensiveValidation.test.mjs tests/platformRobotR16ExperimentInfrastructure.test.mjs tests/platformRobotR15MultiwindowProtocol.test.mjs tests/platformRobotR15WindowOutcome.test.mjs tests/platformRobotR14PostCandle.test.mjs tests/platformRobotR13GitEvidenceChain.test.mjs tests/platformRobotR12EvidenceReconciliation.test.mjs tests/platformRobotR46TemporalLease.test.mjs
      - name: FC03 original core identity and fixture journey
        run: node --test tests/platformFC03CoreInspection.test.mjs tests/platformFC03FunctionalPath.test.mjs
      - name: FC05 local integrated UI homologation
        run: node --test tests/platformFC04CommercialJourney.test.mjs tests/platformFC04PaymentGates.test.mjs
      - name: B305 finance email template and guards
        run: node --test tests/jeniosB305FinanceEmail.test.mjs tests/jeniosB305OutboxWorker.test.mjs tests/jeniosB305PrivateRunner.test.mjs tests/jeniosB305ReadinessDiagnostic.test.mjs tests/jeniosB305Dunning.test.mjs tests/jeniosB305DunningRoute.test.mjs tests/jeniosB305LifecycleCampaigns.test.mjs tests/jeniosB305TransactionalDelivery.test.mjs tests/emailPublicCopyB305.test.mjs tests/jeniosB305AuthLifecycleEmails.test.mjs tests/jeniosB305OnboardingBridge.test.mjs tests/jeniosB305SubscriptionLifecycleEmails.test.mjs tests/jeniosB305MarketingPlanner.test.mjs tests/jeniosB305NonFinancialLifecycle.test.mjs tests/jeniosB305UniversityMilestones.test.mjs tests/jeniosB305EmailAdminHealth.test.mjs tests/jeniosB305ResendSuppressionLedger.test.mjs tests/jeniosB305EmailObservability.test.mjs tests/jeniosB305EmailReleaseReadiness.test.mjs tests/jeniosB305UniversityDeliveryEvidence.test.mjs tests/jeniosB305UniversityMessageAdapter.test.mjs tests/jeniosB305MarketingMessageAdapter.test.mjs tests/jeniosB305FinanceOutboxIndex.test.mjs tests/jeniosB305EmailPreflightSql.test.mjs tests/jeniosB305ResendWebhookEndpoint.test.mjs tests/jeniosB305MarketingDeliveryWorker.test.mjs tests/jeniosB305UniversityTransactionalWorker.test.mjs
      - name: Full regression and Next build with real sending disabled
        run: npm run build
      - name: Browser desktop mobile permissions and recovery against local production build
        run: |
          set -euo pipefail
          command -v google-chrome
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3055 > /tmp/jenios-fc05-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3055/platform/assistente >/dev/null; then break; fi
            sleep 1
          done
          node scripts/platform/fc05-browser-homologation.mjs
