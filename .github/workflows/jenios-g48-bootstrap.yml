name: JENIOS G48 one-time bootstrap

on:
  push:
    branches: [fix/jenios-g48-inter-vault-20261025]
    paths: [.g48-bootstrap/READY]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jenios-g48-bootstrap
  cancel-in-progress: false

jobs:
  install-certified-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate certified patch payload
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ad0a86eee09aa8fb63235f736650819df64b07e7 HEAD
          test -f .g48-bootstrap/READY
          test "$(cat .g48-bootstrap/READY)" = "ceb5fd6a4fe417bdf473573dc8685a88602cc9d5204d927bd01f70702d693234"
          test "$(find .g48-bootstrap -maxdepth 1 -type f -name 'patch[0-9][0-9]' | wc -l | tr -d ' ')" = "9"
          cat .g48-bootstrap/patch?? | base64 --decode > /tmp/jenios-g48.patch.xz
          test "$(sha256sum /tmp/jenios-g48.patch.xz | cut -d' ' -f1)" = "ceb5fd6a4fe417bdf473573dc8685a88602cc9d5204d927bd01f70702d693234"
          xz --test /tmp/jenios-g48.patch.xz
          xz --decompress --stdout /tmp/jenios-g48.patch.xz > /tmp/jenios-g48.patch
          test "$(sha256sum /tmp/jenios-g48.patch | cut -d' ' -f1)" = "e4bca0886cf5bc5df6cb75987610357ca8a63d31377f5dfb8d3029bf411bcb52"
          git apply --check /tmp/jenios-g48.patch

      - name: Install exact reviewed G48 tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/jenios-g48.patch
          rm -rf .g48-bootstrap
          rm -f .github/workflows/jenios-g48-bootstrap.yml
          git add -A
          test "$(git write-tree)" = "c425df0cf0edd2c652212e0f2991a13d3dba9809"
          node scripts/check-inter-vault-g48.mjs
          git diff --cached --check

      - name: Commit certified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jenios-release-bot"
          git config user.email "jenios-release-bot@users.noreply.github.com"
          git commit -m "fix(jenios): G48 install isolated Inter Vault and Master setup"
          test "$(git rev-parse HEAD^{tree})" = "c425df0cf0edd2c652212e0f2991a13d3dba9809"
          git push origin HEAD:fix/jenios-g48-inter-vault-20261025
