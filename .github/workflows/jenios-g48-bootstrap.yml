name: JENIOS G48 baseline inventory diagnostics

on:
  push:
    branches: [fix/jenios-g48-inter-vault-20261025]
    paths: [.github/workflows/jenios-g48-bootstrap.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Generate inventory from certified base commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g48-inventory
          git ls-tree -r --full-tree dec6ae5965b443ed0b8baabf05f750e33b403067 > /tmp/g48-inventory/ls-tree.txt
          python - <<'PY'
          import json, subprocess
          base='dec6ae5965b443ed0b8baabf05f750e33b403067'
          tree='1adba07a869ecd798455bd0805e50a9d5500b58d'
          raw=subprocess.check_output(['git','ls-tree','-r','--full-tree',base],text=True)
          blobs={}
          for line in raw.splitlines():
              meta,path=line.split('\t',1)
              _,kind,sha=meta.split(' ',2)
              if kind=='blob': blobs[path]=sha
          with open('/tmp/g48-inventory/generated-baseline.json','w',encoding='utf-8') as fh:
              fh.write(json.dumps({'baseCommit':base,'baseTree':tree,'blobs':blobs},ensure_ascii=False,indent=2)+'\n')
          print('blob_count='+str(len(blobs)))
          PY
          git hash-object /tmp/g48-inventory/generated-baseline.json | tee /tmp/g48-inventory/git-hash.txt
          sha256sum /tmp/g48-inventory/generated-baseline.json | tee /tmp/g48-inventory/sha256.txt
          wc -c /tmp/g48-inventory/generated-baseline.json | tee /tmp/g48-inventory/bytes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_G48_BASELINE_DIAGNOSTIC
          path: /tmp/g48-inventory/
          retention-days: 2
          if-no-files-found: error
