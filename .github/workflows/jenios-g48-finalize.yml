name: JENIOS G48 certified finalizer

on:
  push:
    branches: [fix/jenios-g48-inter-vault-20261025]
    paths: [.github/workflows/jenios-g48-finalize.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jenios-g48-certified-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reconstruct, verify and publish certified G48 source
        run: python .g48-bootstrap/finalize.py
# publish functional source only; connector performs exact workflow/cleanup commit

