name: JENIOS G43 contextual assistants
on:
  push:
    branches: [feat/jenios-genios-contexto-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-conversations-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      JENIOS_G43_TEST_DATABASE_URL: postgresql://postgres:disposable_g43_test_password@127.0.0.1:55443/jenios_genios_g43_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Start disposable PostgreSQL 17 on loopback
        shell: bash
        run: |
          docker run --detach --name jenios-genios-g43-postgres --network host \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=disposable_g43_test_password \
            -e POSTGRES_DB=jenios_genios_g43_ci postgres:17-bookworm \
            -p 55443 -c listen_addresses=127.0.0.1
          for attempt in {1..30}; do
            if docker exec jenios-genios-g43-postgres pg_isready -h 127.0.0.1 -p 55443 -U postgres -d jenios_genios_g43_ci; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify ownership, retention, concurrency, replay and conservative budget
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-genios-conversations-postgres.mjs 2>&1 | tee /tmp/jenios-genios-g43-postgres.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: JENIOS_GENIOS_G43_POSTGRES_20261024
          path: /tmp/jenios-genios-g43-postgres.log
          retention-days: 30
          if-no-files-found: error
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force jenios-genios-g43-postgres
  verify-source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: https://platform-test.invalid
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: fixture-public-key
      NEXT_PUBLIC_SUPABASE_URL: https://social-test.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-public-key
      JENIOS_ASSISTANT_MEMORY_ENABLED: 'false'
      JENIOS_SALES_GENERATIVE_ENABLED: 'false'
      JENIOS_PRO_GENERATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Preserve the R42 production source outside reviewed assistant changes
        run: node scripts/check-genios-context-g43.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all inherited tests and build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/jenios-genios-g43-build.log
      - name: Preserve exact source and review checkpoint
        shell: bash
        run: |
          mkdir -p .jenios-genios-g43-evidence
          git archive --format=zip --output=.jenios-genios-g43-evidence/JENIOS_GENIOS_G43_SOURCE.zip HEAD
          git rev-parse HEAD > .jenios-genios-g43-evidence/COMMIT.txt
          sha256sum .jenios-genios-g43-evidence/JENIOS_GENIOS_G43_SOURCE.zip > .jenios-genios-g43-evidence/SHA256SUMS.txt
          cp /tmp/jenios-genios-g43-build.log .jenios-genios-g43-evidence/
          cp docs/assistant/G43-CHECKPOINT.md docs/assistant/G43-PRODUCTION-BASELINE.json .jenios-genios-g43-evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_GENIOS_G43_BACKUP_20261024
          path: .jenios-genios-g43-evidence/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
