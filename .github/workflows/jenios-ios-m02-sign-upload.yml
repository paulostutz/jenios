name: JENIOS M02 sign and upload reviewed iOS archive
on:
  push:
    branches: [build/jenios-ios-m02-sign-20261024]
    paths: ['.github/workflows/jenios-ios-m02-sign-upload.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jenios-ios-m02-sign-upload
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'paulostutz/jenios' && github.ref == 'refs/heads/build/jenios-ios-m02-sign-20261024'
    runs-on: macos-15
    environment: jenios-ios-m02
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Download only the reviewed JENIOS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jenios"
          gh run download 40154403855 --repo paulostutz/jenios --name JENIOS-M02-iOS-unsigned --dir "$RUNNER_TEMP/jenios"
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile,plistlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'jenios/JENIOS-M02-iOS-unsigned.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='11f88b14ceeff0527c2c255f0e068cbdb81241bef0dab912bae5fa38d570513a'
          with zipfile.ZipFile(p) as z:
              info=plistlib.loads(z.read('JENIOS.xcarchive/Products/Applications/JENIOS.app/Info.plist'))
              assert info['CFBundleIdentifier']=='br.com.jenios.app' and info['CFBundleVersion']=='2'
              assert info['CFBundleShortVersionString']=='1.0.0'
          PY
          ditto -x -k "$RUNNER_TEMP/jenios/JENIOS-M02-iOS-unsigned.zip" "$RUNNER_TEMP/jenios"
          xattr -r -d com.apple.FinderInfo "$RUNNER_TEMP/jenios/JENIOS.xcarchive" 2>/dev/null || true
          xattr -r -d com.apple.ResourceFork "$RUNNER_TEMP/jenios/JENIOS.xcarchive" 2>/dev/null || true
      - name: Sign the fixed JENIOS archive with the existing Apple account
        env:
          CERTIFICATE_BASE64: ${{ secrets.JENIOS_IOS_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.JENIOS_IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.JENIOS_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/jenios.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/jenios.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/jenios.mobileprovision" > "$RUNNER_TEMP/jenios-profile.plist"
          python3 - <<'PY'
          import plistlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);profile=plistlib.loads((root/'jenios-profile.plist').read_bytes())
          assert profile['UUID']=='3038a821-6181-449a-a695-c64f0d55ff82'
          assert profile['Entitlements']['application-identifier']=='JTJS54L3SK.br.com.jenios.app'
          assert profile['Entitlements']['get-task-allow']==False
          opts={'method':'app-store-connect','destination':'export','signingStyle':'manual','teamID':'JTJS54L3SK','signingCertificate':'Apple Distribution','provisioningProfiles':{'br.com.jenios.app':'JENIOS App Store 2026'},'manageAppVersionAndBuildNumber':False,'uploadSymbols':True}
          (root/'jenios/ExportOptions.plist').write_bytes(plistlib.dumps(opts))
          PY
          JENIOS_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$JENIOS_KEYCHAIN_PASSWORD"
          security create-keychain -p "$JENIOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/jenios.keychain-db"
          security set-keychain-settings -lut 1800 "$RUNNER_TEMP/jenios.keychain-db"
          security unlock-keychain -p "$JENIOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/jenios.keychain-db"
          security import "$RUNNER_TEMP/jenios.p12" -k "$RUNNER_TEMP/jenios.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$JENIOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/jenios.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/jenios.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/jenios.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/3038a821-6181-449a-a695-c64f0d55ff82.mobileprovision"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/jenios/JENIOS.xcarchive" -exportPath "$RUNNER_TEMP/jenios/export" -exportOptionsPlist "$RUNNER_TEMP/jenios/ExportOptions.plist"
      - name: Verify exported IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,plistlib,os,zipfile,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'jenios/export';files=list(root.glob('*.ipa'));assert len(files)==1
          p=files[0]
          with zipfile.ZipFile(p) as z:
              info=plistlib.loads(z.read('Payload/JENIOS.app/Info.plist'))
              assert info['CFBundleIdentifier']=='br.com.jenios.app' and info['CFBundleVersion']=='2'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('JENIOS_IPA_PATH='+str(p)+'\n')
          (root/'SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
          ditto -x -k "$JENIOS_IPA_PATH" "$RUNNER_TEMP/jenios/verified"
          codesign --verify --deep --strict "$RUNNER_TEMP/jenios/verified/Payload/JENIOS.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS-M02-iOS-signed
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/jenios/export/*.ipa
            ${{ runner.temp }}/jenios/export/SHA256SUMS.txt
      - name: Validate and upload only JENIOS to TestFlight
        env:
          APPLE_KEY_BASE64: ${{ secrets.JENIOS_APPSTORE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          JENIOS_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_KZBF69PDUB.p8"
          trap 'rm -f "$JENIOS_KEY_PATH"' EXIT
          printf '%s' "$APPLE_KEY_BASE64" | base64 --decode > "$JENIOS_KEY_PATH"
          xcrun altool --validate-app --file "$JENIOS_IPA_PATH" --type ios --apiKey KZBF69PDUB --apiIssuer 6e39682c-03c1-490e-b54d-531979c680e0 --output-format json
          xcrun altool --upload-app --file "$JENIOS_IPA_PATH" --type ios --apiKey KZBF69PDUB --apiIssuer 6e39682c-03c1-490e-b54d-531979c680e0 --output-format json
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/jenios.keychain-db" || true
          rm -f "$RUNNER_TEMP/jenios.p12" "$RUNNER_TEMP/jenios.mobileprovision" "$RUNNER_TEMP/jenios-profile.plist" "$HOME/Library/MobileDevice/Provisioning Profiles/3038a821-6181-449a-a695-c64f0d55ff82.mobileprovision" "$HOME/.appstoreconnect/private_keys/AuthKey_KZBF69PDUB.p8"
