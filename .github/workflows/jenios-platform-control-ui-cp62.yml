name: JENIOS Platform CP62 private UI QA
on:
  push:
    branches:
      - fix/jenios-platform-control-ui-cp62-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies with scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Platform regressions
        run: npm test
      - name: Build in isolated QA with dummy public values
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://qa.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_public_placeholder_not_a_secret'
          NEXT_PUBLIC_SUP_PUBLISHABLE_KEY: 'qa_public_placeholder_not_a_secret'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'qa_public_placeholder_not_a_secret'
        run: npm run build
      - name: Archive cumulative changes with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .jenios-platform-backup
          FILES=(
            app/dashboard-logado/page.js
            app/dashboard-logado/control.module.css
            app/dashboard/page.js
            app/mesa-operacoes/page.js
            app/mesa-operacao/page.js
            app/diagnostico/page.js
            app/lp/page.js
            app/admin/page.js
            app/admin/page.module.css
            app/admin/login/page.js
            app/components/AdminAccess.js
            app/components/platform/Terminal.module.css
            lib/platform/diagnostic-routing.mjs
            tests/platformDiagnosticPages.test.mjs
            tests/platformDiagnosticRouting.test.mjs
            tests/platformControlUI.test.mjs
            .github/workflows/jenios-platform-diagnostico-private-qa.yml
            .github/workflows/jenios-platform-control-ui-cp62.yml
          )
          sha256sum "${FILES[@]}" > .jenios-platform-backup/SHA256SUMS.txt
          tar -czf .jenios-platform-backup/JENIOS-PLATFORM-CP62-CUMULATIVO.tar.gz "${FILES[@]}" .jenios-platform-backup/SHA256SUMS.txt
      - name: Store private QA source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-platform-cp62-private-source
          path: .jenios-platform-backup/JENIOS-PLATFORM-CP62-CUMULATIVO.tar.gz
          if-no-files-found: error
          retention-days: 30
