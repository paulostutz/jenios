name: JENIOS Platform CP69 launch authentication and protected QA
on:
  push:
    branches:
      - fix/jenios-platform-cp69-lancamento-auth-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cp69_disposable_not_a_real_password
          POSTGRES_DB: jenios_cp69
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jenios_cp69"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: cp69_disposable_not_a_real_password
      PGDATABASE: jenios_cp69
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test diagnostic and risk tables in ephemeral PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/platform/cp64-database-isolation.sql
          psql -v ON_ERROR_STOP=1 -f scripts/platform/cp66-risk-isolation.sql
          psql -v ON_ERROR_STOP=1 -f scripts/platform/cp67r1-remote-role-isolation.sql
      - name: Full inherited and checkpoint regression
        run: npm test
      - name: Compile with fictitious nonfunctional credentials
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://qa.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_public_placeholder_not_a_secret'
          NEXT_PUBLIC_SUP_PUBLISHABLE_KEY: 'qa_public_placeholder_not_a_secret'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'qa_public_placeholder_not_a_secret'
        run: npm run build
      - name: Start ephemeral local Next server
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://qa.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_public_placeholder_not_a_secret'
        run: |
          nohup node_modules/.bin/next start -p 3127 > /tmp/jenios-cp67-server.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/dashboard; then exit 0; fi
            sleep 1
          done
          cat /tmp/jenios-cp67-server.log
          exit 1
      - name: Confirm restricted HTTP endpoints fail closed without dedicated backend
        run: node scripts/platform/cp67r1-negative-http.mjs
      - name: Chromium desktop tablet and mobile integration smoke
        run: node scripts/platform/cp69-browser-smoke.mjs
      - name: Integrity-checked dedicated Supabase CP67R1 source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .jenios-platform-qa
          FILES=(
            app/dashboard-logado/layout.js
            app/components/platform/PlatformAuthGuard.js
            lib/platform/supabase-client.js
            app/platform/entrar/page.js
            app/platform/admin/page.js
            app/components/platform/PlatformAdminAccess.js
            lib/platform/admin-permissions.mjs
            app/api/platform/admin/access/route.js
            supabase/migrations/20261019113500_platform_dedicated_admin_roles_cp67r1.sql
            tests/platformCP67R1Dedicated.test.mjs
            scripts/platform/cp67r1-remote-role-isolation.sql
            scripts/platform/cp67r1-browser-smoke.mjs
            scripts/platform/cp67r1-negative-http.mjs
            .github/workflows/jenios-platform-cp67r1-dedicated.yml
            app/components/platform/PlatformBillingStatus.js
            app/components/platform/PlatformAdminShortcut.js
            app/components/platform/PlatformAdminOverview.js
            app/api/platform/admin/overview/route.js
            lib/platform/simulation-account.mjs
            tests/platformCP68AreaIntegration.test.mjs
            scripts/platform/cp68-browser-smoke.mjs
            .github/workflows/jenios-platform-cp68-area-integration.yml
            app/platform/recuperar/page.js
            app/platform/redefinir/page.js
            lib/platform/account-access.mjs
            tests/platformCP69AccountAccess.test.mjs
            scripts/platform/cp69-authenticated-e2e.mjs
            scripts/platform/cp69-browser-smoke.mjs
            docs/platform/CP69-HOMOLOGACAO-AUTENTICADA.md
            .github/workflows/jenios-platform-cp69-launch-readiness.yml
            app/admin/page.js
            app/admin/page.module.css
            app/admin/login/page.js
            app/admin/plataforma/permissoes/page.js
            app/components/AdminAccess.js
            app/dashboard-logado/page.js
            app/dashboard-logado/control.module.css
            app/dashboard/page.js
            app/diagnostico/page.js
            app/mesa-operacao/page.js
            app/mesa-operacoes/page.js
            app/lp/page.js
            app/components/platform/Terminal.module.css
            lib/platform/diagnostic-routing.mjs
            lib/platform/diagnostic-client.mjs
            lib/platform/diagnostic-server.mjs
            lib/platform/request-limit.mjs
            lib/platform/admin-db.mjs
            lib/platform/risk-evidence.mjs
            lib/platform/risk-client.mjs
            lib/platform/simulation-journal.mjs
            lib/platform/private-acceptance.mjs
            app/api/platform/diagnostico/route.js
            app/api/platform/risk-summary/route.js
            supabase/migrations/20261019014500_platform_diagnostic_private_cp63.sql
            supabase/migrations/20261019023000_platform_risk_evidence_cp66.sql
            tests/platformDiagnosticPages.test.mjs
            tests/platformDiagnosticRouting.test.mjs
            tests/platformDiagnosticServer.test.mjs
            tests/adminPaymentStatement.test.mjs
            tests/platformControlUI.test.mjs
            tests/platformCP64Isolation.test.mjs
            tests/platformCP65Sessions.test.mjs
            tests/platformCP66Evidence.test.mjs
            tests/platformCP67Acceptance.test.mjs
            scripts/platform/cp63-browser-smoke.mjs
            scripts/platform/cp64-database-isolation.sql
            scripts/platform/cp66-risk-isolation.sql
            scripts/platform/cp66-browser-smoke.mjs
            scripts/platform/cp67-browser-smoke.mjs
            scripts/platform/cp67-negative-http.mjs
            .github/workflows/jenios-platform-diagnostico-private-qa.yml
            .github/workflows/jenios-platform-control-ui-cp62.yml
            .github/workflows/jenios-platform-cp63-private.yml
            .github/workflows/jenios-platform-cp64-isolated.yml
            .github/workflows/jenios-platform-cp65-isolated.yml
            .github/workflows/jenios-platform-cp66-isolated.yml
            .github/workflows/jenios-platform-cp67-isolated.yml
          )
          sha256sum "${FILES[@]}" > .jenios-platform-qa/SHA256SUMS-CP69.txt
          tar -czf .jenios-platform-qa/JENIOS-PLATFORM-CP69-SOURCE.tar.gz "${FILES[@]}" .jenios-platform-qa/SHA256SUMS-CP69.txt
      - name: Store private integrity archive
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-platform-cp69-launch-source
          path: .jenios-platform-qa/JENIOS-PLATFORM-CP69-SOURCE.tar.gz
          retention-days: 30
          if-no-files-found: error
      - name: Store browser QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-platform-cp69-launch-visuals
          path: .jenios-platform-qa/screenshots/*.png
          retention-days: 14
          if-no-files-found: warn

  authenticated-qa:
    # Disabled until dedicated secrets and branch-protected QA environment exist.
    if: ${{ vars.PLATFORM_CP69_REMOTE_QA_ENABLED == 'true' }}
    needs: certification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: jenios-platform-auth-qa
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLATFORM_SUPABASE_URL: 'https://xaicvhagftzjkqphnbgx.supabase.co'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://xaicvhagftzjkqphnbgx.supabase.co'
      PLATFORM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLATFORM_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PLATFORM_QA_PUBLISHABLE_KEY }}
      PLATFORM_QA_PUBLISHABLE_KEY: ${{ secrets.PLATFORM_QA_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'offline_social_placeholder'
      PLATFORM_QA_NEXT_URL: 'http://127.0.0.1:3129'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Reject unconfigured credentials without leaking values
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PLATFORM_QA_PUBLISHABLE_KEY:-}" ]; then
            echo 'Dedicated environment secrets missing; authenticated QA is not certified.'
            exit 1
          fi
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build local app with real dedicated public configuration
        run: npm run build
      - name: Start temporary local app with protected server credentials
        shell: bash
        run: |
          set -euo pipefail
          nohup node_modules/.bin/next start -p 3129 > /tmp/jenios-platform-cp69-private-qa.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:3129/dashboard; then exit 0; fi
            sleep 1
          done
          echo 'Private local QA server failed to start.'
          exit 1
      - name: Live authentication, role matrix and guaranteed QA cleanup
        run: node scripts/platform/cp69-authenticated-e2e.mjs
