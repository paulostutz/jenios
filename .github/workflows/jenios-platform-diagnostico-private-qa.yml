name: JENIOS Platform diagnostic flow isolated QA
on:
  push:
    branches:
      - fix/jenios-platform-fluxo-diagnostico-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and integration tests
        run: npm test
      - name: Verify compilation with placeholder credentials
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://qa.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_placeholder_not_a_secret'
        run: npm run build

      - name: Package reviewed Platform hotfix source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .jenios-platform-backup
          FILES=(
            app/dashboard-logado/page.js
            app/dashboard/page.js
            app/diagnostico/page.js
            app/mesa-operacao/page.js
            app/mesa-operacoes/page.js
            app/lp/page.js
            lib/platform/diagnostic-routing.mjs
            tests/platformDiagnosticRouting.test.mjs
            tests/platformDiagnosticPages.test.mjs
            .github/workflows/jenios-platform-diagnostico-private-qa.yml
          )
          sha256sum "${FILES[@]}" > .jenios-platform-backup/SHA256SUMS.txt
          tar -czf .jenios-platform-backup/JENIOS-PLATFORM-SITE-UX-SOURCE.tar.gz "${FILES[@]}" .jenios-platform-backup/SHA256SUMS.txt
      - name: Archive reviewed source (no deploy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-platform-site-ux-source
          path: .jenios-platform-backup/JENIOS-PLATFORM-SITE-UX-SOURCE.tar.gz
          if-no-files-found: error
          retention-days: 30
