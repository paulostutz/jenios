name: JENIOS R114 existing reverse and Ultra flow context
on:
  push:
    branches: [work/jenios-r114-reverse-flow-context-20261107]
  pull_request:
    paths:
      - 'lib/platform/research/market-flow-*.mjs'
      - 'lib/platform/research/ultrafast-v2-pipeline.mjs'
      - 'tests/platformRobotR114*.test.mjs'
      - 'docs/release/R114*'
      - 'scripts/check-authentication-r106.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test tests/platformRobotR114*.test.mjs tests/platformUltraV2*.test.mjs tests/platformUltraV3*.test.mjs tests/platformRobotR113UltraRelease.test.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: git diff --check
