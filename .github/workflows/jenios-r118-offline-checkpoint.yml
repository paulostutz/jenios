name: JENIOS R118 offline checkpoint
on:
  pull_request:
    paths:
      - 'lib/platform/ultra/**'
      - 'scripts/platform/ultra/**'
      - 'scripts/check-authentication-r106.mjs'
      - 'tests/platformUltraR118*'
      - 'docs/release/R118*'
      - 'public/downloads/jenios-ultra-r118-checkpoint.zip'
      - '.github/workflows/jenios-r118-offline-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/platformUltraR118*.test.mjs
      - run: python3 -B scripts/platform/ultra/test_mt5_collector.py && python3 -B scripts/platform/ultra/test_mt5_collector_r118.py && python3 -B scripts/platform/ultra/test_profit_sdk_inventory.py
      - run: node scripts/check-authentication-r106.mjs
      - run: python3 scripts/platform/ultra/package-r118.py && git diff --exit-code -- public/downloads/jenios-ultra-r118-checkpoint.zip
