name: JENIOS R120 Binance event sandbox
on:
  pull_request:
    paths:
      - 'lib/platform/ultra/**'
      - 'scripts/platform/ultra/**'
      - 'scripts/check-authentication-r106.mjs'
      - 'tests/platformUltraR120*'
      - 'docs/release/R120*'
      - 'public/downloads/jenios-ultra-r120-checkpoint.zip'
      - '.github/workflows/jenios-r120-binance-events.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/platformUltraR120*.test.mjs
      - run: node scripts/check-authentication-r106.mjs
      - run: python3 scripts/platform/ultra/package-r120.py && git diff --exit-code -- public/downloads/jenios-ultra-r120-checkpoint.zip
