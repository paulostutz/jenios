name: JENIOS R77 Alpaca PAPER private transport - no live
on:
  push:
    branches: [fix/jenios-r77-paper-official-transport-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jenios-r77-paper-private
  cancel-in-progress: false
jobs:
  verify-r77:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: https://platform-test.invalid
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: synthetic-platform-public-key
      NEXT_PUBLIC_SUPABASE_URL: https://social-test.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-social-public-key
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install existing lockfile without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate G49, G48, M02, R75, R76 and R77 SHA-approved source
        run: node scripts/check-pro-image-g49.mjs && node scripts/check-mobile-m02.mjs && node scripts/check-inter-vault-g48.mjs
      - name: Private Paper once-only and loss-risk tests (network mocked)
        run: |
          node --test tests/platformRobotR77AlpacaPrivateTransport.test.mjs \
           tests/platformAlpacaPaperLedgerReconcile.test.mjs \
           tests/platformAlpacaPaperRiskRehearsal.test.mjs \
           tests/platformNativeBrokerBridge.test.mjs
      - name: Full application, Social S05 regression and Next.js build
        run: npm run build
      - name: Verify original public readiness remains NO LIVE
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/api/platform/robots/execute/route.js
          test ! -e app/api/platform/orders/live/route.js
          test ! -e app/api/platform/brokers/submit/route.js
          node_modules/.bin/next start -H 127.0.0.1 -p 3167 >/tmp/jenios-r77-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:3167/integracoes; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3167/api/platform/broker-readiness > /tmp/jenios-r77-readiness.json
          node -e "const x=require('/tmp/jenios-r77-readiness.json'); if(x.realOrdersEnabled!==false||x.demoOrdersCertified!==false) process.exit(1)"
      - name: Archive exact public source and checksum
        if: always()
        shell: bash
        run: |
          mkdir -p .jenios-r77-ci
          git rev-parse HEAD > .jenios-r77-ci/COMMIT.txt
          git archive --format=zip --output=.jenios-r77-ci/R77_PUBLIC_SOURCE.zip HEAD
          (cd .jenios-r77-ci && sha256sum R77_PUBLIC_SOURCE.zip > SHA256SUMS.txt)
          cp docs/release/R77-001-ALPACA-PAPER-PRIVATE-TRANSPORT-20261027.md .jenios-r77-ci/
      - name: Upload public source/checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_R77_PAPER_PRIVATE_CI
          path: .jenios-r77-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
