name: JENIOS R79 atomic PAPER consent (NO LIVE / NO ORDERS)
on:
  push:
    branches: [fix/jenios-r79-paper-atomic-claim-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jenios-r79-atomic-consent
  cancel-in-progress: false
jobs:
  verify-r79:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: https://platform-test.invalid
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: synthetic-platform-public-key
      NEXT_PUBLIC_SUPABASE_URL: https://social-test.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-social-public-key
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - name: Install exact existing dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify signed G49/G48/M02 and R75-R79 hashes
        run: node scripts/check-pro-image-g49.mjs && node scripts/check-mobile-m02.mjs && node scripts/check-inter-vault-g48.mjs
      - name: Verify R79 atomic claim/revocation, R78 signed permit and original R77
        run: |
          node --test tests/platformRobotR79AtomicClaim.test.mjs \
            tests/platformRobotR78SignedPaperAuth.test.mjs \
            tests/platformRobotR77AlpacaPrivateTransport.test.mjs \
            tests/platformAlpacaPaperLedgerReconcile.test.mjs
      - name: Complete regression, 94 Social S05, Next.js compile
        run: npm run build
      - name: No new public order endpoint or modified mobile or core
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/api/platform/robots/execute/route.js
          test ! -e app/api/platform/orders/live/route.js
          test ! -e app/api/platform/brokers/submit/route.js
          git diff --quiet 691db9e5e27a44a03d3edf33b32260c88f7d0337 HEAD -- native-app app/api public
          git diff --quiet b8f246ec007e11074a78ba03820040a105bb9c07 HEAD -- lib/platform/connections/alpaca-paper-private-transport-r77.mjs
      - name: Preserve exact git SHA, source archive and SHA256
        if: always()
        shell: bash
        run: |
          mkdir -p .jenios-r79-ci
          git rev-parse HEAD > .jenios-r79-ci/COMMIT.txt
          git archive --format=zip --output=.jenios-r79-ci/JENIOS_R79_PUBLIC_SOURCE.zip HEAD
          (cd .jenios-r79-ci && sha256sum JENIOS_R79_PUBLIC_SOURCE.zip > SHA256SUMS.txt)
          cp docs/release/R79-001-ATOMIC-PAPER-CONSENT-20261027.md .jenios-r79-ci/
      - name: Upload nonsecret checkpoint and reproducible source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_R79_ATOMIC_CONSENT_CI
          path: .jenios-r79-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
