name: JENIOS R80-R97 private safeguards (NO LIVE / NO ORDERS)
on:
  push:
    branches: [fix/jenios-r80-private-paper-safety-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jenios-r80-paper-safety
  cancel-in-progress: true
jobs:
  verify-r80:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: https://platform-test.invalid
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: synthetic-platform-public-key
      NEXT_PUBLIC_SUPABASE_URL: https://social-test.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-social-public-key
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_PRIVATE_PAPER_REHEARSAL: 'false'
      JENIOS_R80_PRIVATE_ISSUER_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_RECOVERY_ENABLED: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - name: Install exact existing dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify R80 private safety, issuer, recovery and original R77-R79
        run: |
          node --test tests/platformRobotR80PaperSafety.test.mjs \
            tests/platformRobotR80SafetyStore.test.mjs \
            tests/platformRobotR80Issuer.test.mjs \
            tests/platformRobotR81OwnerRisk.test.mjs \
            tests/platformRobotR82LiveReadOnly.test.mjs \
            tests/platformRobotR83LiveVault.test.mjs \
            tests/platformRobotR83VaultStore.test.mjs \
            tests/platformRobotR83PrivateWorker.test.mjs \
            tests/platformRobotR80Recovery.test.mjs \
            tests/platformRobotR80WorkerBoundary.test.mjs \
            tests/platformRobotR85Readiness.test.mjs \
            tests/platformRobotR86LedgerRestart.test.mjs \
            tests/platformRobotR87RecoveryInventory.test.mjs \
            tests/platformRobotR88DurableSymbol.test.mjs \
            tests/platformRobotR89RecoveryInventoryIntegrity.test.mjs \
            tests/platformRobotR93PrivateCoordinator.test.mjs \
            tests/platformRobotR94PrivateHostPreflight.test.mjs \
            tests/platformRobotR95OfflineStorageProbe.test.mjs \
            tests/platformRobotR96BinancePrivateReadOnly.test.mjs \
            tests/platformRobotR97PrivateHostGates.test.mjs \
            tests/platformRobotR79AtomicClaim.test.mjs \
            tests/platformRobotR78SignedPaperAuth.test.mjs \
            tests/platformRobotR77AlpacaPrivateTransport.test.mjs \
            tests/platformAlpacaPaperLedgerReconcile.test.mjs
      - name: Full regression and Next.js compilation
        run: npm run build
      - name: Preserve unrelated source and installed SQL version
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/api/platform/robots/execute/route.js
          test ! -e app/api/platform/orders/live/route.js
          test ! -e app/api/platform/brokers/submit/route.js
          git diff --quiet a24922cc829dd1b45b87a719e9fd57ab45e6d79b HEAD -- native-app app/api public
          test -z "$(git diff --name-only a24922cc829dd1b45b87a719e9fd57ab45e6d79b HEAD -- supabase/migrations | grep -Ev '^supabase/migrations/(20261027134227_jenios_robot_r80_private_paper_safety|20261027141752_jenios_robot_r81_paper_owner_risk|20261027151211_jenios_robot_r83_private_live_vault)\.sql$' || true)"
          cmp -s supabase/review/jenios_r80_paper_safety.sql supabase/migrations/20261027134227_jenios_robot_r80_private_paper_safety.sql
          cmp -s supabase/review/jenios_r81_paper_owner_risk.sql supabase/migrations/20261027141752_jenios_robot_r81_paper_owner_risk.sql
          cmp -s supabase/review/jenios_r83_live_private_vault.sql supabase/migrations/20261027151211_jenios_robot_r83_private_live_vault.sql
          git diff --quiet a24922cc829dd1b45b87a719e9fd57ab45e6d79b HEAD -- lib/platform/connections/alpaca-paper-private-transport-r77.mjs

      - name: Preserve reviewed source SHA and nonsecret checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .jenios-r83-ci
          git rev-parse HEAD > .jenios-r83-ci/COMMIT.txt
          git archive --format=zip --output=.jenios-r83-ci/JENIOS_R83_PUBLIC_SOURCE.zip HEAD
          (cd .jenios-r83-ci && sha256sum JENIOS_R83_PUBLIC_SOURCE.zip > SHA256SUMS.txt)
          if test -f docs/release/R83-001-PRIVATE-LIVE-VAULT-20261027.md; then
            cp docs/release/R83-001-PRIVATE-LIVE-VAULT-20261027.md .jenios-r83-ci/
          fi
      - name: Upload nonsecret JENIOS R83 checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_R83_PRIVATE_LIVE_VAULT_CI
          path: .jenios-r83-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
