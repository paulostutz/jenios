name: JENIOS ROBOT R1 isolated adverse QA — no deployment
on:
  push:
    branches: [fix/jenios-robot-r1-adversarial-qa-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
      JENIOS_PRO_GENERATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R1 adversarial Manual Hybrid Reverse and prior contracts
        run: |
          node --test \
            tests/platformRobotR1AdversarialGates.test.mjs \
            tests/platformRobotR1ScenarioSweeps.test.mjs \
            tests/platformB288PairedFilterAudit.test.mjs \
            tests/platformB289OperatorReversal.test.mjs \
            tests/platformB290InversionSignalContract.test.mjs \
            tests/platformB291ThreeModeCopilot.test.mjs \
            tests/platformB300EvidenceReconciliationGate.test.mjs \
            tests/platformB301DurableCohortLink.test.mjs
      - name: Full regression / S05 / Next.js build
        run: npm run build
      - name: Archive non-proprietary robot QA documents only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_ROBOT_R1_ADVERSARIAL_QA
          path: |
            docs/platform/ROBOT-R1-ADVERSARIAL-VALIDATION.md
            lib/platform/research/robot-r1-adversarial-gates.mjs
            tests/platformRobotR1AdversarialGates.test.mjs
            tests/platformRobotR1ScenarioSweeps.test.mjs
          retention-days: 30
