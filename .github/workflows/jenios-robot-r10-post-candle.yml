name: JENIOS R10 strict post-close candle observation contract
on:
  push:
    branches: [fix/jenios-robot-r10-post-target-public-candle-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R10 future window and no trade tests
        run: node --test tests/platformRobotR10PostCandle.test.mjs
      - name: Full regression and build
        run: npm run build
      - name: Preserve contract only, no market outcome before close
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_R10_FUTURE_READINESS_NO_OUTCOME
          path: |
            lib/platform/research/robot-r10-post-candle.mjs
            tests/platformRobotR10PostCandle.test.mjs
            docs/platform/ROBOT-R10-READINESS.md
          retention-days: 30
