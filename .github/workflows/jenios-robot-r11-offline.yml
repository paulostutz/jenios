name: JENIOS ROBOT R11 offline source and pair identity hardening
on:
  push:
    branches: [fix/jenios-robot-r11-offline-evidence-hardening-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R11 adversarial offline sources and original R7/R10 gates
        run: node --test tests/platformRobotR11OfflineEvidenceHardening.test.mjs tests/platformRobotR7PublicH1.test.mjs tests/platformRobotR10PostCandle.test.mjs
      - name: Full regression and build, no public GET
        run: npm run build
      - name: Archive no-secret offline QA only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_R11_OFFLINE_HARDENING
          path: |
            docs/platform/ROBOT-R11-OFFLINE-HARDENING.md
            tests/platformRobotR11OfflineEvidenceHardening.test.mjs
          retention-days: 30
