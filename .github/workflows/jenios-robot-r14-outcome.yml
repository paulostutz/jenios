name: JENIOS ROBOT R14 outcome observation (manual read-only)
on:
  workflow_dispatch:
  push:
    branches: [research/jenios-robot-r14-evidence-20261022]
    paths:
      - docs/platform/evidence/ROBOT_R14_OUTCOME_TRIGGER.txt
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Observe exact preregistered R14 candle
        run: node scripts/platform/research/robot-r14-post-candle.mjs
      - name: Archive raw public responses and observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_ROBOT_R14_OUTCOME_READONLY
          path: .jenios-r14-outcome/
          include-hidden-files: true
          retention-days: 30
