name: JENIOS ROBOT R14 public context only
on:
  push:
    branches: [research/jenios-robot-r14-evidence-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/platform/research/robot-r8-public-market.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_R14_PUBLIC_CONTEXT
          path: .jenios-r8-ci/
          include-hidden-files: true
          retention-days: 7
