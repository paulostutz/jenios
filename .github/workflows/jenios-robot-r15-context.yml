name: JENIOS ROBOT R15 fresh public context (read-only)
on:
  workflow_dispatch:
  push:
    branches: [research/jenios-robot-r15-multiwindow-prospective-20261022]
    paths:
      - docs/platform/evidence/ROBOT_R15_CONTEXT_TRIGGER.txt
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Capture fresh closed BTC-USD context
        run: node scripts/platform/research/robot-r8-public-market.mjs
      - name: Archive fresh public context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_ROBOT_R15_FRESH_PUBLIC_CONTEXT
          path: .jenios-r8-ci/
          include-hidden-files: true
          retention-days: 7
