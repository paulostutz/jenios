name: JENIOS ROBOT-R3 descriptive prospective blocks — offline only
on:
  push:
    branches: [fix/jenios-robot-r3-prospective-statistical-audit-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
      JENIOS_PRO_GENERATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked packages without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R3 daily-block multiplicity/coverage and existing R1/R2 risk tests
        run: |
          node --test \
            tests/platformRobotR3ProspectiveBlocks.test.mjs \
            tests/platformRobotR1AdversarialGates.test.mjs \
            tests/platformRobotR1ScenarioSweeps.test.mjs \
            tests/platformB280ForwardProtocol.test.mjs \
            tests/platformB288PairedFilterAudit.test.mjs \
            tests/platformB289OperatorReversal.test.mjs \
            tests/platformB290InversionSignalContract.test.mjs \
            tests/platformB301DurableCohortLink.test.mjs
      - name: Full regressions S05 and Next.js build
        run: npm run build
      - name: Preserve research-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_ROBOT_R3_OFFLINE_DAILY_BLOCKS
          path: |
            docs/platform/ROBOT-R3-PROSPECTIVE-BLOCK-RESEARCH.md
            lib/platform/research/robot-r3-prospective-block-audit.mjs
            tests/platformRobotR3ProspectiveBlocks.test.mjs
          retention-days: 30
