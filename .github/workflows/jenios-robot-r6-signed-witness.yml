name: JENIOS ROBOT-R6 local signed witness-chain audit (no deploy)
on:
  push:
    branches: [fix/jenios-robot-r6-signed-witness-chain-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
      JENIOS_PAY_PAYMENTS_ENABLED: 'false'
      JENIOS_INTER_CHARGES_ENABLED: 'false'
      JENIOS_PRO_GENERATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R6 Ed25519 configured-key witness, replay, clock & R5 dual-source gates
        run: |
          node --test \
            tests/platformRobotR6SignedWitnessChain.test.mjs \
            tests/platformRobotR5DualSourceIntegrity.test.mjs \
            tests/platformRobotR4ExecutionFeasibility.test.mjs \
            tests/platformRobotR3ProspectiveBlocks.test.mjs \
            tests/platformRobotR1AdversarialGates.test.mjs \
            tests/platformRobotR1ScenarioSweeps.test.mjs \
            tests/platformB298SignedEvidenceAudit.test.mjs \
            tests/platformB299PrivateConsentReplayJournal.test.mjs \
            tests/platformB301DurableCohortLink.test.mjs
      - name: Full regression and Next.js compilation, no deployment
        run: npm run build
      - name: Preserve no-secret evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_ROBOT_R6_CONFIGURED_SIGNER_CHAIN_OFFLINE
          path: |
            lib/platform/research/robot-r6-signed-witness-chain.mjs
            tests/platformRobotR6SignedWitnessChain.test.mjs
            docs/platform/ROBOT-R6-CONFIGURED-WITNESS-INTEGRITY.md
          retention-days: 30
