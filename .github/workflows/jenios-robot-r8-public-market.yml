name: JENIOS ROBOT R8 private core public input (offline no deployment)
on:
  push:
    branches: [fix/jenios-robot-r8-genuine-private-core-context-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R8 private interface validation
        run: node --test tests/platformRobotR8PublicMarket.test.mjs
      - name: Public context capture without original code
        id: capture
        continue-on-error: true
        run: node scripts/platform/research/robot-r8-public-market.mjs
      - name: Full regression and Next.js compilation
        run: npm run build
      - name: Archive public closed candles or capture failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_ROBOT_R8_ORIGINAL_CORE_PUBLIC_INPUT
          path: |
            .jenios-r8-ci/
            docs/platform/ROBOT-R8-PUBLIC-CONTEXT.md
          include-hidden-files: true
          retention-days: 30
