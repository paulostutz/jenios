name: JENIOS R9 fail-closed private original core future preregistration
on:
  push:
    branches: [fix/jenios-robot-r9-forward-private-core-prereg-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
      JENIOS_PRIVATE_PAPER_TRANSPORT_ENABLED: 'false'
      JENIOS_PRIVATE_PAPER_EXECUTOR: 'false'
      JENIOS_REAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R9 no-backdating preregistration and R8 original data boundary
        run: node --test tests/platformRobotR9PrivatePrecommit.test.mjs tests/platformRobotR8PublicMarket.test.mjs
      - name: Fresh CLOSED public BTC-USD bars, no private core in runner
        id: fresh_context
        continue-on-error: true
        run: node scripts/platform/research/robot-r8-public-market.mjs
      - name: Store public context separately even if GET failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_R9_NEW_PUBLIC_CLOSED_INPUT_ONLY
          path: .jenios-r8-ci/
          include-hidden-files: true
          retention-days: 7
      - name: Full regression S05 and Next.js build
        run: npm run build
      - name: Archive no-secrets R9 contracts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_ROBOT_R9_NO_GO_PRECOMMIT_CONTRACTS
          path: |
            lib/platform/research/robot-r9-private-precommit.mjs
            tests/platformRobotR9PrivatePrecommit.test.mjs
            docs/platform/ROBOT-R9-GENUINE-FORWARD-NO-GO.md
          retention-days: 30
