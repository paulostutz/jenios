name: JENIOS S05 + Platform CP70 integration regression
on:
  push:
    branches:
      - release/jenios-s05-platform-cp70-integracao-20261019
      - fix/jenios-b129-b132-master-users-learning-ai-20261020
      - fix/jenios-b128-genio-genia-floating-university-20261020
      - fix/jenios-b122-b125-master-hub-media-assistant-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-integrated-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Assert original Social financial routes and files remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const base='f4232312a6704aa27ba4d2fc0d0e6181bba0a426';
          const paths=execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).split('\n').filter(Boolean);
          const reviewed=new Set(['lib/admin-access.mjs','lib/admin-users.mjs','lib/trend-alerts.mjs','lib/trends-service.mjs','lib/social/media.mjs','app/components/TrendsHub.js','app/components/TrendAlertButton.js',
           'app/api/admin/access/route.js','app/api/admin/ecosystem/route.js','app/api/admin/users/route.js','app/api/platform/assistant/route.js','app/api/platform/learning/route.js',
           'db/schema/assistant-r27.sql','db/schema/learning-r26.sql','tests/jeniosHubB123.test.mjs','tests/socialMediaB124.test.mjs',
           'tests/assistantR27.test.mjs','tests/jeniosMasterUsersB129.test.mjs','tests/jeniosUniversityDailyB130.test.mjs','tests/jeniosAssistantFloatingB128.test.mjs','tests/learningR26.test.mjs','tests/jeniosMasterB122.test.mjs','tests/jeniosRestoreB125.test.mjs']);
          const allowed=paths.every(p=>reviewed.has(p)||p.startsWith('app/components/assistant/')||p.startsWith('app/components/learning/')||
           p.startsWith('lib/assistant/')||p.startsWith('lib/learning/')||p.startsWith('public/assistentes/')||
           p.startsWith('app/platform/aprender/')||p.startsWith('app/platform/assistente/')||
           p.startsWith('app/components/brand/')||p.startsWith('public/brand/')||new Set(['app/icon.png','app/icon.svg','app/favicon.ico','app/apple-icon.png','app/apple-icon.js','app/page.js','app/lp/page.js','tests/jeniosBrandB110.test.mjs','tests/socialR24.test.mjs']).has(p)||p.startsWith('app/platform/')||p.startsWith('app/components/platform/')||p.startsWith('app/api/platform/admin/')||p.startsWith('app/api/platform/diagnostico/')||p.startsWith('app/api/platform/risk-summary/')||p==='app/api/platform/market-observation/route.js'||p.startsWith('lib/platform/')||p.startsWith('scripts/platform/')||p.startsWith('docs/platform/')||p.startsWith('supabase/migrations/20261019')||p.startsWith('tests/platform')||p==='tests/adminPaymentStatement.test.mjs'||p.startsWith('app/dashboard')||p.startsWith('app/mesa-operacoes/')||p.startsWith('app/mesa-operacao/')||p.startsWith('app/diagnostico/')||p.startsWith('app/admin/')||p==='app/components/AdminAccess.js'||p==='lib/release/environment-scope.mjs'||p==='tests/release-s05/environment-b40.test.mjs'||p==='.github/workflows/jenios-s05-platform-cp70-integration.yml'||new Set(['app/social/page.js','app/social/jenios-theme.css','app/components/SocialMobileRail.js','app/components/useSocialFeed.js','lib/social/feed-optimistic.mjs','tests/socialFeedOptimistic.test.mjs','tests/socialMobileB75.test.mjs','tests/release-s05/mobile-nav-b41.test.mjs','docs/platform/B75-MOBILE-HUB.md','app/components/SocialDirect.js','app/social/perfil/[id]/page.js','tests/socialProfileB76.test.mjs','tests/release-s05/reels-b51.test.mjs','tests/release-s05/highlights-b52.test.mjs','docs/platform/B76-PERFIL-DIRECT.md']).has(p));
          assert.ok(allowed,'Blocked modification outside Platform integration allowlist: '+paths.filter(p=>!allowed).join(','));
          for(const p of ['app/login/page.js','package.json','package-lock.json','next.config.js']){
            const before=execFileSync('git',['show',base+':'+p],{encoding:'utf8'});
            const now=readFileSync(p,'utf8');
            assert.equal(now,before,'Protected Social S05 source drift: '+p);
          }
          const brand=readFileSync('app/components/brand/BrandSignature.js','utf8');
          assert.match(brand,/jenios-logo-horizontal.webp/);
          assert.match(brand,/jenios-j.webp/);
          for(const p of ['app/lp/page.js','app/social/page.js','app/dashboard/page.js','app/mesa-operacoes/page.js','app/admin/page.js','app/platform/admin/page.js']){
            assert.match(readFileSync(p,'utf8'),/BrandLockup/,'Missing approved JENIOS brand: '+p);
          }
          const social=readFileSync('app/social/page.js','utf8');
          for(const marker of ['SocialPostCard','SocialSidebarPremium','useSocialFeed','onLoadComments={feed.comments}','onCreateComment={feed.comment}','onCurtir={curtirPost}','SocialMobileRail'])assert.ok(social.includes(marker),'Preserve functional Social entry: '+marker);
          for(const path of ['app/admin/login/page.js','app/admin/page.js']){
            const secure=readFileSync(path,'utf8');
            assert.doesNotMatch(secure,/admin123|senha === 'admin'/i,'Demo administrative bypass must be absent: '+path);
          }
          assert.match(readFileSync('app/admin/page.js','utf8'),/AdminAccess permission/);
          assert.match(readFileSync('lib/admin-access.mjs','utf8'),/if\(!isMasterAdmin\(user\)\)/,'Master backend gate required');
          assert.match(readFileSync('app/components/TrendsHub.js','utf8'),/item\.id !== 'tokens'/,'Social Hub must omit search trends');
          assert.match(readFileSync('app/dashboard-logado/layout.js','utf8'),/<PlatformAuthGuard>\{children\}<\/PlatformAuthGuard>/,'Preserve independent Platform guard');
          assert.match(readFileSync('app/dashboard-logado/page.js','utf8'),/href="\/platform\/assistente"/,'Restore Genio/Genia via on-demand links');
          assert.match(readFileSync('app/api/platform/learning/route.js','utf8'),/OPENAI_API_KEY:''/,'No-cost learning mode required');
          console.log('CP70_INTEGRATION_S05_PRESERVED='+paths.length);
          NODE
      - name: Install exact Social S05 locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full inherited and Platform unit regression
        run: npm test
      - name: Social S05 release and API integrity regression
        run: npm run test:release-s05
      - name: Combined Next.js 15 release build (local scoped, no keys)
        run: npm run build
      - name: Start local Next.js 15 server for desktop, tablet and mobile smoke
        shell: bash
        run: |
          set -euo pipefail
          nohup node_modules/.bin/next start -p 3127 > /tmp/jenios-cp70-integrated-local.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/dashboard; then exit 0; fi
            sleep 1
          done
          cat /tmp/jenios-cp70-integrated-local.log
          exit 1
      - name: Integration Chrome smoke across Simulator, Mesa and Admin
        run: node scripts/platform/cp69-browser-smoke.mjs
      - name: Save integrity manifest of integrated source changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .jenios-integration-qa
          # Record deletions separately: old R24 purple icons are intentionally replaced.
          git diff --diff-filter=ACMRT --name-only f4232312a6704aa27ba4d2fc0d0e6181bba0a426 HEAD | grep -v '^.github/workflows/' > .jenios-integration-qa/integrated-files.txt
          git diff --diff-filter=D --name-only f4232312a6704aa27ba4d2fc0d0e6181bba0a426 HEAD > .jenios-integration-qa/deleted-files.txt
          while IFS= read -r file; do
            if [ -n "$file" ]; then sha256sum "$file"; fi
          done < .jenios-integration-qa/integrated-files.txt > .jenios-integration-qa/SHA256SUMS.txt
          tar -czf .jenios-integration-qa/JENIOS-S05-PLATFORM-CP70.tar.gz -T .jenios-integration-qa/integrated-files.txt .jenios-integration-qa/SHA256SUMS.txt .jenios-integration-qa/deleted-files.txt
      - name: Preserve integrated source package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-s05-platform-cp70-integration-source
          path: .jenios-integration-qa/JENIOS-S05-PLATFORM-CP70.tar.gz
          retention-days: 30
          if-no-files-found: error
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-s05-platform-cp70-browser-qa
          path: .jenios-platform-qa/screenshots/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Report isolated integration readiness
        run: echo 'CP70_INTEGRATION_BUILD_PASS - no production deployment or paid operation was initiated'
