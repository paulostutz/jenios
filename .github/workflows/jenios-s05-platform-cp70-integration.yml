name: JENIOS S05 + Platform CP70 integration regression
on:
  push:
    branches:
      - fix/jenios-b148-boost-assistant-20261020
      - fix/jenios-b147-university-monthly-20261020
      - release/jenios-s05-platform-cp70-integracao-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pro-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: jenios_pro_b143_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jenios_pro_b143_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: jenios_pro_b143_test
      PGUSER: postgres
      PGPASSWORD: disposable_ci_password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install disabled ledger in disposable PostgreSQL 17
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/platform/b143-wallet-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f db/schema/pro-wallet-b143.sql
      - name: Verify inactive University and Pro catalog without overwriting existing products
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/platform/b146-catalog-sql-test.sql
      - name: Verify server-only subscription read privileges
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/platform/b146-pay-read-sql-test.sql
      - name: Verify least privileges against Supabase-style broad defaults
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/platform/b147-wallet-privileges-sql-test.sql
      - name: Install private monthly University catalog and ledger atomically
        run: |
          psql -X -1 -v ON_ERROR_STOP=1 -f db/schema/university-monthly-b147.sql
          psql -X -1 -v ON_ERROR_STOP=1 -f db/schema/university-monthly-b147.sql
      - name: Verify monthly calendar, receipts, renewal, isolation and included plans
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/platform/b147-university-sql-test.sql
      - name: Verify arithmetic, privileges, entitlements and reconciliation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/platform/b143-wallet-sql-test.sql
      - name: Verify duplicate requests and shared budgets with simultaneous SQL sessions
        run: node scripts/platform/b143-wallet-concurrency.mjs
      - name: Verify simultaneous University purchase and payment confirmation
        run: node scripts/platform/b147-university-concurrency.mjs
  verify-integrated-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PLATFORM_SIGNUP_ENABLED: 'false'
      NEXT_PUBLIC_PLATFORM_SUPABASE_URL: 'https://qa.invalid'
      NEXT_PUBLIC_PLATFORM_SUPABASE_PUBLISHABLE_KEY: 'qa_platform_publishable_placeholder'
      NEXT_PUBLIC_SUPABASE_URL: 'https://social-qa.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_social_publishable_placeholder'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Preserve approved B147 modules and exact scoped PAY extension
        run: node scripts/platform/b148-integrity.mjs
      - name: Install exact Social S05 locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full inherited and Platform unit regression
        run: npm test
      - name: Social S05 release and API integrity regression
        run: npm run test:release-s05
      - name: Combined Next.js 15 release build (local scoped, no keys)
        run: npm run build
      - name: Start local Next.js 15 server
        shell: bash
        run: |
          set -euo pipefail
          nohup node_modules/.bin/next start -p 3127 > /tmp/jenios-b148-local.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3127/dashboard; then exit 0; fi
            sleep 1
          done
          cat /tmp/jenios-b148-local.log
          exit 1
      - name: Integration Chrome smoke across Simulator, Mesa and Admin
        run: node scripts/platform/cp69-browser-smoke.mjs
      - name: Pro guest, mobile and private API browser smoke
        run: node scripts/platform/b145-pro-ui-smoke.mjs
      - name: Independent University price, guest gates and mobile browser smoke
        run: node scripts/platform/b147-university-ui-smoke.mjs
      - name: Boost preview, WhatsApp, audience and persistent assistant browser smoke
        run: node scripts/platform/b148-browser-smoke.mjs
      - name: Preserve full B148 source and source manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .jenios-integration-qa
          git archive --format=zip --output=.jenios-integration-qa/JENIOS_B148_SOURCE.zip HEAD
          git rev-parse HEAD > .jenios-integration-qa/COMMIT.txt
          git diff --stat 5094cf21005549973664b619307472139ea98a57 HEAD > .jenios-integration-qa/CHANGES.txt
          sha256sum .jenios-integration-qa/JENIOS_B148_SOURCE.zip > .jenios-integration-qa/SHA256SUMS.txt
          cp docs/platform/B148-BOOST-ASSISTANT-VALIDATION.md .jenios-integration-qa/
      - name: Preserve source package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS_B148_BACKUP_20261020
          path: .jenios-integration-qa/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-b148-browser-qa
          path: .jenios-platform-qa/screenshots/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Report isolated integration readiness
        run: echo 'B148_INTEGRATION_PASS - no real payments, provider credentials or paid AI calls'
