name: R34 Social profile staging QA
on:
  push:
    branches:
      - fix/jenios-r34-perfil-grade-homologacao
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without executable install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and regression tests
        run: npm test
      - name: Compile with nonfunctional QA placeholders only
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://qa.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'qa_public_placeholder_not_a_secret'
          NEXT_PUBLIC_SUP_PUBLISHABLE_KEY: 'qa_public_placeholder_not_a_secret'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'qa_public_placeholder_not_a_secret'
        run: npm run build
