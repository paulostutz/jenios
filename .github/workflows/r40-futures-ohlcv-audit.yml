name: R40 Futures Crossvenue OHLCV Audit
on:
  push:
    branches:
      - research/jenios-r40-usdm-futures-crosscheck
    paths:
      - .github/workflows/r40-futures-ohlcv-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Binance USD-M futures monthly ZIP files against published checksums
        run: python scripts/research/r40_fetch_public_usdm_futures.py
        working-directory: .
      - name: Retain source archives and normalized OHLCV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-r40-verified-binance-usdm-futures
          path: out-r40-usdm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
