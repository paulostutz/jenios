name: R40 Official Market Data Audit (public archives only)
on:
  push:
    branches:
      - research/jenios-r40-official-market-data
    paths:
      - .github/workflows/r40-official-ohlcv-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-ohlcv:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download exchange archives, verify official checksums and reject missing candles
        run: python scripts/research/r40_fetch_public_klines.py
      - name: Retain SHA256 evidence and frozen datasets for independent local validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenios-r40-verified-binance-spot-ohlcv
          path: out-r40/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
