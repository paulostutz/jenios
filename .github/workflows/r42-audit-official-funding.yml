name: R42 Official USD-M Funding SHA256 — Public Research Only
on:
  push:
    branches:
      - research/jenios-r42-official-funding
    paths:
      - .github/workflows/r42-audit-official-funding.yml
      - scripts/research/r42_download_official_funding.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  funding-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout read only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test official funding parser in isolation
        run: python scripts/research/r42_download_official_funding.py --selftest
      - name: Verify 45 official monthly USD-M funding archives and SHA256
        run: python scripts/research/r42_download_official_funding.py
      - name: Upload short-lived checksum-verified funding evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS-R42-45-OFFICIAL-FUNDING-CHECKSUMS
          path: r42-official-funding/
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
