name: R43 Official Mark Price Gap Daily Recovery — Public Audit
on:
  push:
    branches:
      - research/jenios-r43-verified-mark-price
    paths:
      - .github/workflows/r43-verified-daily-gap.yml
      - scripts/research/r43_audit_daily_mark_gap.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit six original official daily archives and strict continuity
        run: python scripts/research/r43_audit_daily_mark_gap.py
      - name: Upload only the unmodified verified daily source material and derived day CSVs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS-R43-6-CHECKSUM-VERIFIED-DAILY-MARK-CANDIDATES
          path: r43-official-daily-gap/
          retention-days: 7
          if-no-files-found: error
