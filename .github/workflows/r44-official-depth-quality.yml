name: R44 Public BookDepth Archive Quality — No Order Routing
on:
  push:
    branches:
      - research/jenios-r44-archive-depth-qa
    paths:
      - .github/workflows/r44-official-depth-quality.yml
      - scripts/research/r44_audit_official_bookdepth.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-bookdepth:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Depth-band parser selftest
        run: python scripts/research/r44_audit_official_bookdepth.py --selftest
      - name: Download 6 public daily ZIPs and confirm official SHA256
        run: python scripts/research/r44_audit_official_bookdepth.py
      - name: Retain checksum-verified archived snapshots and data-quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JENIOS-R44-6-BINANCE-BOOKDEPTH-QUALITY
          path: r44-official-bookdepth-qa/
          retention-days: 7
          if-no-files-found: warn
