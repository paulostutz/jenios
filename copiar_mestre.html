<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JENIOS Social - Subscrever e Copiar Mestre</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Cartão do Trader Mestre -->
        <div class="bg-white text-slate-900 border border-slate-300 rounded-2xl p-6 shadow-xl space-y-4">
            
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-purple-700 text-white font-black text-sm flex items-center justify-center">
                        CQ
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900">Carlos Quant (@carlosq)</h3>
                        <span class="text-[10px] text-slate-500 font-mono">Especialista B3 (WIN/WDO)</span>
                    </div>
                </div>
                <!-- Estado em Directo -->
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 animate-pulse">
                    🟢 Online e Operando
                </span>
            </div>

            <!-- Horários Habituais -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-700 space-y-1">
                <div><b>Horário Habitual de Operação:</b> 09:00 às 11:30 (Segunda a Sexta)</div>
                <div><b>Taxa de Acerto Recente:</b> <span class="text-emerald-600 font-bold">84.2%</span></div>
            </div>

            <!-- Proposta de Assinatura (R$ 49,90 / Split) -->
            <div class="border-t border-slate-200 pt-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="text-[10px] font-bold font-mono text-slate-500 uppercase block">Subscrição de Cópia Automática</span>
                    <div class="text-base font-black text-[#7c3aed]">R$ 49,90 <span class="text-xs text-slate-500 font-normal">/ mês</span></div>
                    <span class="text-[9px] text-slate-400">70% repassado ao Mestre | 30% taxa JENIOS</span>
                </div>
                <button onclick="alert('Subscrição de espelhamento iniciada! As ordens do mestre serão copiadas automaticamente na sua conta.')" class="w-full md:w-auto bg-[#7c3aed] hover:bg-[#6d28d9] text-white font-bold text-xs px-6 py-3.5 rounded-xl transition-all shadow-md uppercase tracking-wide cursor-pointer">
                    ⚡ Subscrever e Copiar
                </button>
            </div>

        </div>

    </div>
</body>
</html>
