<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JENIOS ID - Entrar na Conta</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Card de Login -->
    <div class="bg-white text-slate-900 border border-slate-300 rounded-2xl p-8 max-w-md w-full shadow-2xl">
        
        <!-- Identificação da Marca / Módulo -->
        <span class="text-xs text-[#7c3aed] font-bold font-mono tracking-widest uppercase mb-2 block">
            JENIOS ID • Acesso ao Ecossistema
        </span>
        
        <h1 class="text-2xl font-black mb-2 text-slate-900">Entrar na Plataforma</h1>
        <p class="text-xs text-slate-600 mb-6 leading-relaxed">
            Introduza as suas credenciais para aceder ao seu painel, diagnósticos e ferramentas de automação.
        </p>

        <!-- Formulário de Login -->
        <form onsubmit="realizarLogin(event)">
            
            <div class="mb-4">
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">E-mail Profissional</label>
                <input 
                    type="email" 
                    id="loginEmail" 
                    required
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs text-slate-900 focus:outline-none focus:border-[#7c3aed] focus:bg-white transition-all"
                    placeholder="seu@email.com"
                >
            </div>

            <div class="mb-2">
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Palavra-passe (Senha)</label>
                <input 
                    type="password" 
                    id="loginSenha" 
                    required
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs text-slate-900 focus:outline-none focus:border-[#7c3aed] focus:bg-white transition-all"
                    placeholder="Sua senha de acesso"
                >
            </div>

            <!-- Recuperação de Senha -->
            <div class="flex items-center justify-between mb-6 text-xs">
                <label class="flex items-center text-slate-600 cursor-pointer">
                    <input type="checkbox" class="mr-1.5 rounded border-slate-300 text-[#7c3aed] focus:ring-[#7c3aed]">
                    Lembrar de mim
                </label>
                <a href="#" onclick="alert('Funcionalidade de recuperação de senha acionada.')" class="text-[#7c3aed] font-bold hover:underline">Esqueceu a senha?</a>
            </div>

            <button 
                type="submit" 
                class="w-full bg-[#7c3aed] hover:bg-[#6d28d9] text-white font-bold text-xs py-3.5 rounded-xl transition-all shadow-lg shadow-purple-600/20 uppercase tracking-wide cursor-pointer"
            >
                Aceder à Plataforma
            </button>
        </form>

        <!-- Rodapé do Card -->
        <div class="mt-6 text-center border-t border-slate-200 pt-4">
            <p class="text-xs text-slate-600">
                Ainda não tem conta? 
                <a href="#" onclick="alert('Redirecionando para a tela de cadastro...')" class="text-[#7c3aed] font-bold hover:underline">Registar-se</a>
            </p>
        </div>

    </div>

    <!-- Script de Simulação de Ação -->
    <script>
        function realizarLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            
            alert(`Login efetuado com sucesso para ${email}! Este bloco HTML está pronto para guardar no Bloco de Notas como login.html.`);
        }
    </script>
</body>
</html>
