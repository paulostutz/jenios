<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JENIOS - Meus Mestres e Espelhamentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <div class="bg-white text-slate-900 border border-slate-300 rounded-2xl p-6 shadow-xl flex justify-between items-center">
            <div>
                <span class="text-xs text-[#7c3aed] font-bold font-mono tracking-widest uppercase mb-1 block">
                    JENIOS TRADING • Gestão de Copy-Trading
                </span>
                <h1 class="text-2xl font-black text-slate-900">Meus Mestres Ativos</h1>
                <p class="text-xs text-slate-600">Monitorize e controle os traders cujas ordens são espelhadas automaticamente na sua conta.</p>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-purple-100 text-[#7c3aed]">
                2 Mestres Conectados
            </span>
        </div>

        <div class="space-y-4">
            
            <!-- Mestre 1 -->
            <div class="bg-white text-slate-900 border border-slate-300 rounded-2xl p-5 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-purple-700 text-white font-black text-xs flex items-center justify-center shrink-0">
                        CQ
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-0.5">
                            <h4 class="text-xs font-black text-slate-900">Carlos Quant (@carlosq)</h4>
                            <span class="bg-emerald-100 text-emerald-800 text-[9px] font-bold px-2 py-0.5 rounded">🟢 Online</span>
                        </div>
                        <p class="text-xs text-slate-500 font-mono">Espelhamento Ativo • Lote Padrão (1 Contrato)</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <button onclick="alert('Alerta sonoro e visual ativado para este mestre.')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3.5 py-2 rounded-xl transition-all cursor-pointer">🔔 Alerta Ativo</button>
                    <button onclick="alert('Espelhamento pausado para este mestre.')" class="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold px-3.5 py-2 rounded-xl transition-all cursor-pointer">Pausar Cópia</button>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
