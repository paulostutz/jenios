<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JENIOS Social - Configuração Inicial de Perfil</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Card de Registo / Configuração Social -->
    <div class="bg-white text-slate-900 border border-slate-300 rounded-2xl p-8 max-w-lg w-full shadow-2xl">
        
        <!-- Identificação da Marca / Módulo -->
        <span class="text-xs text-[#7c3aed] font-bold font-mono tracking-widest uppercase mb-2 block">
            JENIOS SOCIAL • Onboarding da Comunidade
        </span>
        
        <h1 class="text-2xl font-black mb-2 text-slate-900">Personalize a sua Conta Social</h1>
        <p class="text-xs text-slate-600 mb-6 leading-relaxed">
            Defina como será visto pelos outros operadores na rede social e nas comunidades temáticas do ecossistema.
        </p>

        <!-- Formulário de Configuração Social -->
        <div class="space-y-4 mb-6">
            
            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Nome de Utilizador (Handle)</label>
                <div class="flex items-center bg-slate-50 border border-slate-300 rounded-xl overflow-hidden focus-within:border-[#7c3aed]">
                    <span class="pl-3 text-xs text-slate-400 font-mono">@</span>
                    <input type="text" placeholder="seu.nome" class="w-full bg-transparent p-3 text-xs text-slate-900 focus:outline-none font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Biografia Curta / Perfil Operacional</label>
                <textarea rows="3" placeholder="Ex: Trader focado em mini-índice e proteção de capital com robôs HFT..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs text-slate-900 focus:outline-none focus:border-[#7c3aed] resize-none"></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Especialidade Principal (Tag do Perfil)</label>
                <select class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs text-slate-900 focus:outline-none focus:border-[#7c3aed]">
                    <option>Day Trade & Mini-Índice (B3)</option>
                    <option>Criptomoedas & Futuros (24/7)</option>
                    <option>Análise Quantitativa & Automação</option>
                    <option>Psicologia & Mindset Operacional</option>
                </select>
            </div>

        </div>

        <button 
            onclick="concluirSetupSocial()" 
            class="w-full bg-[#7c3aed] hover:bg-[#6d28d9] text-white font-bold text-xs py-3.5 rounded-xl transition-all shadow-lg shadow-purple-600/20 uppercase tracking-wide cursor-pointer"
        >
            Guardar Perfil e Entrar no Feed Global
        </button>

    </div>

    <!-- Script de Ação -->
    <script>
        function concluirSetupSocial() {
            alert('Perfil social configurado com sucesso! Pronto para guardar como setup_social.html no Bloco de Notas.');
        }
    </script>
</body>
</html>
